# The organizations-apply installation with the platform tenant's users and editors retired and the
# customer's platform team kept (tenants.platformTeam): the connectivity chart renders no
# agent-platform:platform-user binding in kagent and keeps agent-platform:editor there for the
# platform team alone; the meta chart adds the team to muster's mcpserver-editor and workflow-editor
# subjects. muster's MCP-server viewers are a group and a ServiceAccount, whose apiGroup is none.
# Invented names, placeholder values.
input:
  installation:
    name: garnet
    baseDomain: garnet.example.io
    customer: giantswarm
    provider: capa
    private: false
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000007
    podCertificateRequest: true
    portalClientSecret: true
    portals:
      - installation: gopher
        customer: giantswarm
        domain: portal.example.io
        handKept: true
        chartLine: ">=2.1.0 <3.0.0"
    federation:
      hubs: [gopher]
      registryHub: gopher
      targets: []
  organizations:
    enabled: true
  musterMcpServerViewers:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: oidc:example-agent-users
    - kind: ServiceAccount
      name: example-agent-runner
      namespace: example-agents
  tenants:
    platform:
      users: []
      editors: []
    platformTeam:
      - apiGroup: rbac.authorization.k8s.io
        kind: Group
        name: oidc:example-platform-team
