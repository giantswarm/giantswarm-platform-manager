# Rendered by giantswarm-platform-manager, agent-platform definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-app-config-backstage
  namespace: backstage
data:
  app-config.agent-platform.yaml: |
    app:
      extensions:
        $include: shared-config.yaml#extensionsAgentPlatform
      portals:
        agentPlatform: true
    agentPlatform:
      kagent:
        installations:
          garnet: {}
      organizations:
        enabled: true
    muster:
      installations:
        - name: garnet
          url: https://muster.garnet.example.io/mcp
          authProvider: oidc-garnet
