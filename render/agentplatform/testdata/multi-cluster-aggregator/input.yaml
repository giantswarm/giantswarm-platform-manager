# A customer with several installations and one aggregator: the organisation's portal brokers on
# "heron", so heron exchanges tokens into its public siblings and lists their MCP servers, no
# tunnel. The connector every sibling's Dex registers is the policy's, from the organisation's
# name. Invented names, placeholder values.
input:
  installation:
    name: heron
    baseDomain: heron.oakridge.example
    customer: oakridge
    provider: capz
    private: false
    chartLine: "3"
    musterClientId: 00000000-0000-4000-8000-000000000003
    podCertificateRequest: false
    portals:
      - installation: kestrel
        customer: oakridge
        domain: portal.kestrel.oakridge.example
    federation:
      hubs: []
      brokerClientId: broker-client-id-placeholder
      targets:
        - installation: kestrel
          baseDomain: kestrel.oakridge.example
          private: false
        - installation: plover
          baseDomain: plover.oakridge.example
          private: false
secrets: {}
