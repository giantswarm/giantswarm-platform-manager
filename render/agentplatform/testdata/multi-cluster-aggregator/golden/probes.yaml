- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.heron.oakridge.example/auth?client_id=00000000-0000-4000-8000-000000000003&redirect_uri=https://muster.heron.oakridge.example/oauth/callback&response_type=code&scope=openid
  expect:
    status: 302
- id: live-muster-protected-resource
  feature: tool-access
  kind: HTTP
  url: https://muster.heron.oakridge.example/.well-known/oauth-protected-resource
  expect:
    status: 200
    bodyContains: '"resource":"https://muster.heron.oakridge.example/mcp"'
- id: live-own-mcp-servers
  feature: tool-access
