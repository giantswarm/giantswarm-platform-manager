# Rendered by giantswarm-platform-manager, agent-platform definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-app-config-backstage
  namespace: backstage
data:
  app-config.agent-platform.yaml: |
    app:
      extensions:
        $include: shared-config.yaml#extensionsAgentPlatform
    agentPlatform:
      fluxServiceAccountName: kagent-flux
      kagent:
        installations:
          heron: {}
          kestrel: {}
          plover: {}
    muster:
      installations:
        - name: heron
          url: https://muster.heron.oakridge.example/mcp
          authProvider: oidc-heron
        - name: kestrel
          url: https://muster.kestrel.oakridge.example/mcp
          authProvider: oidc-kestrel
        - name: plover
          url: https://muster.plover.oakridge.example/mcp
          authProvider: oidc-plover
