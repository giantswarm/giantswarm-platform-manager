# The customer-portal definition's input for the organizations-portal shape: the
# same installation as ../organizations-portal/input.yaml with the platform
# enabled, so the portal's tree lists the platform's Component, whose fragment
# turns on the Organizations pages. The chart line holds the pin in charts.yaml.
# Invented names; the supplied values are dry-run markers.
input:
  installation:
    name: garnet
    baseDomain: garnet.example.io
    customer: giantswarm
    provider: capa
    region: example-region-2
    pipeline: testing
    agentPlatform: true
  portal:
    domain: portal.garnet.example.io
    title: Example Portal
    organization: Example
    supportUrl: https://support.example.io/
  chart:
    line: ">=2.0.0 <3.0.0"
  plugins:
    github:
      enabled: true
    grafana:
      enabled: false
    flux:
      enabled: false
    sentry:
      enabled: false
  tunnel:
    enabled: false
