# The customer-portal definition's input for the public-customer shape: the
# same installation as ../public-customer/input.yaml with the platform enabled,
# so the portal's tree lists the platform's Component and the agent-platform
# definition carries the portal's Dex client; the Grafana plugin wired, as the
# shape's portal fact says. The chart line holds the pin in charts.yaml.
# Invented names; the supplied values are dry-run markers.
input:
  installation:
    name: kestrel
    baseDomain: kestrel.oakridge.example
    customer: oakridge
    provider: capa
    region: example-region-1
    pipeline: stable
    agentPlatform: true
  portal:
    domain: portal.kestrel.oakridge.example
    organization: Oakridge
    supportUrl: https://support.oakridge.example/
  chart:
    line: ">=2.0.0 <3.0.0"
  plugins:
    github:
      enabled: true
    grafana:
      enabled: true
    flux:
      enabled: false
    sentry:
      enabled: false
  tunnel:
    enabled: false
