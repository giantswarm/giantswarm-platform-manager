# The charts that consume the files the definitions render, pinned
# to the versions the render-consumption test (consumption_test.go) renders them
# at. Renovate bumps every `version:` through the org preset's regex manager (a
# `registry:` line followed by a `version:` line, datasource docker); a bump that
# breaks a Secret contract fails the test with the chart, Secret and key named.
#
charts:
  # The installation's own MCP servers: the fleet bases' HelmReleases over the
  # emitted extras/<server>/ directories.
  - name: mcp-kubernetes
    registry: gsoci.azurecr.io/charts/giantswarm/mcp-kubernetes
    version: 1.2.22
  - name: mcp-prometheus
    registry: gsoci.azurecr.io/charts/giantswarm/mcp-prometheus
    version: 0.10.8
  - name: mcp-capi
    registry: gsoci.azurecr.io/charts/giantswarm/mcp-capi
    version: 0.5.21
  # Every server's Valkey (the fleet base) and muster's (a child of the meta chart).
  - name: valkey
    registry: gsoci.azurecr.io/charts/giantswarm/valkey
    version: 0.1.4
  # The installation's Dex, rendered with the emitted dex-app patch. 3.2.0 is the
  # first version with mcpPrometheus and mcpCapi as built-in clients reading a
  # clientSecretRef, the version the definition targets.
  - name: dex-app
    registry: gsoci.azurecr.io/charts/giantswarm/dex-app
    version: 3.2.1
  # The meta chart, the 3.x line: the fleet base caps it <4.0.0, and the 4.x line
  # needs inputs the definition does not carry (kagent.harness.snapshotLocation).
  # renovate-custom.json5 keeps this pin below 4.0.0.
  - name: agent-platform
    registry: gsoci.azurecr.io/charts/giantswarm/agent-platform
    version: 3.23.1
  # The meta chart hands its connectivity child the whole platform values, Secret
  # names included, so the test renders it too; it follows the meta chart's line.
  - name: agent-platform-connectivity
    registry: gsoci.azurecr.io/charts/giantswarm/agent-platform-connectivity
    version: 3.23.1
  # The meta chart's children that read the platform Secrets, at the newest
  # versions inside the ranges the meta chart declares for them.
  - name: muster
    registry: gsoci.azurecr.io/charts/giantswarm/muster
    version: 5.27.8
  - name: kagent
    registry: gsoci.azurecr.io/charts/giantswarm/kagent
    version: 0.3.3
  - name: agent-manager
    registry: gsoci.azurecr.io/charts/giantswarm/agent-manager
    version: 0.4.5
  # The meta chart's children the policy offers Giant Swarm-owned installations;
  # rendered when a shape on the pinned line enables them.
  - name: klaus-gateway
    registry: gsoci.azurecr.io/charts/giantswarm/klaus-gateway
    version: 1.15.1
  - name: cluster-manager
    registry: gsoci.azurecr.io/charts/giantswarm/cluster-manager
    version: 0.14.0
  # The developer portal, rendered over the fleet base with the customer-portal
  # definition's own files (its app-config, values and Secrets) and, in the
  # platform shapes, the agent-platform definition's Component: its values
  # ConfigMap and the Vertex credentials Secret.
  - name: backstage
    registry: gsoci.azurecr.io/charts/giantswarm/backstage
    version: 2.30.0
