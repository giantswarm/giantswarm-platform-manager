# Stands in for the dex-app Konfiguration ConfigMap of an installation without
# the agent platform, under the customer-portal definition's dex-app
# configmap-values.yaml.patch: the management-cluster facts and the login
# client; none of the platform's built-in clients (the chart renders each of
# them only with its secret reference, which the agent-platform definition's
# patch carries). Invented values.
isManagementCluster: true
managementCluster:
  name: example
oidc:
  issuerAddress: dex.example.test
  staticClients:
    dexK8SAuthenticator:
      clientAddress: https://login.example.test
