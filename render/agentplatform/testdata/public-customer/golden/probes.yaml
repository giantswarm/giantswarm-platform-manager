- id: live-oauth2-proxy-audience
  feature: identity
  kind: LogAbsent
  namespace: kagent
  resource: Deployment
  name: kagent-oauth2-proxy
  expect:
    absent: audience .* does not match
- id: live-drift
  feature: runtime
  kind: Drift
  namespace: flux-giantswarm
  resource: HelmRelease
  name: agent-platform
  expect:
    note: the values the HelmRelease reads from its ConfigMaps are the rendered values
- id: live-kagent-provider-values
  feature: runtime
  kind: Drift
  namespace: flux-giantswarm
  resource: HelmRelease
  name: kagent
  expect:
    note: .spec.values.providers are the rendered kagent.providers (the meta chart forwards its kagent block flat)
    compare:
      - live: spec.values.providers
        rendered: kagent.providers
- id: live-oauth2-proxy-extra-audience
  feature: identity
  kind: Drift
  namespace: kagent
  resource: Deployment
  name: kagent-oauth2-proxy
  expect:
    note: --oidc-extra-audience carries the rendered audiences
    compare:
      - live: spec.template.spec.containers[0].args[args]
        rendered: kagent.oauth2-proxy.extraArgs.oidc-extra-audience
        prefix: --oidc-extra-audience=
- id: live-muster-trusted-audiences
  feature: identity
  kind: Drift
  namespace: agent-platform
  resource: ConfigMap
  name: muster-config
  expect:
    note: trustedAudiences are the rendered muster.muster.oauth.server.trustedAudiences
    compare:
      - live: data.config.yaml:aggregator.oauth.server.trustedAudiences
        rendered: muster.muster.oauth.server.trustedAudiences
- id: live-muster-connector-and-client-id
  feature: identity
  kind: Drift
  namespace: agent-platform
  resource: ConfigMap
  name: muster-config
  expect:
    note: the Dex connectorId is the rendered muster.muster.oauth.server.dex.connectorId
    compare:
      - live: data.config.yaml:aggregator.oauth.server.dex.connectorId
        rendered: muster.muster.oauth.server.dex.connectorId
