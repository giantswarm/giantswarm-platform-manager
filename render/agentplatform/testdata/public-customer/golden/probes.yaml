- id: live-kagent-workloads
  feature: runtime
  kind: Condition
  namespace: kagent
  resource: Deployment
  name: kagent-controller
  expect:
    condition: Available
    conditionStatus: "True"
- id: live-kagent-workloads
  feature: runtime
  kind: Condition
  namespace: kagent
  resource: Deployment
  name: kagent-ui
  expect:
    condition: Available
    conditionStatus: "True"
- id: live-kagent-workloads
  feature: runtime
  kind: Condition
  namespace: kagent
  resource: Deployment
  name: kagent-oauth2-proxy
  expect:
    condition: Available
    conditionStatus: "True"
- id: live-kagent-workloads
  feature: runtime
  kind: Condition
  namespace: kagent
  resource: Cluster.postgresql.cnpg.io
  name: kagent-pg
  expect:
    condition: Ready
    conditionStatus: "True"
- id: live-oauth2-proxy-secret-and-flux-sa
  feature: secrets
  kind: ResourcePresent
  namespace: kagent
  resource: Secret
  name: kagent-oauth2-proxy-credentials
  expect:
    keys:
      - client-id
      - client-secret
      - cookie-secret
- id: live-oauth2-proxy-secret-and-flux-sa
  feature: secrets
  kind: ResourcePresent
  namespace: kagent
  resource: ServiceAccount
  name: kagent-flux
- id: live-model-configs
  feature: runtime
  kind: Condition
  namespace: kagent
  resource: ModelConfig.kagent.dev
  name: default-model-config
  expect:
    condition: Accepted
    conditionStatus: "True"
    note: waiting for the customer's model key (Secret kagent-anthropic-key, key ANTHROPIC_API_KEY, or a ModelConfig in the portal)
- id: live-kagent-api-protected
  feature: identity
  kind: HTTP
  url: https://kagent.kestrel.oakridge.example/api/agents
  expect:
    status: 403
- id: live-kagent-login-redirect
  feature: identity
  kind: HTTP
  url: https://kagent.kestrel.oakridge.example/oauth2/start
  expect:
    status: 302
    locationContains: client_id=kagent
    note: the login redirects to Dex at https://dex.kestrel.oakridge.example/auth as client kagent
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.kestrel.oakridge.example/auth?client_id=00000000-0000-4000-8000-000000000001&redirect_uri=https://muster.kestrel.oakridge.example/oauth/callback&response_type=code&scope=openid
  expect:
    status: 302
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.kestrel.oakridge.example/auth?client_id=kagent&redirect_uri=https://kagent.kestrel.oakridge.example/oauth2/callback&response_type=code&scope=openid
  expect:
    status: 302
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.kestrel.oakridge.example/auth?client_id=backstage&redirect_uri=https://portal.kestrel.oakridge.example/api/auth/oidc-kestrel/handler/frame&response_type=code&scope=openid
  expect:
    status: 302
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.kestrel.oakridge.example/auth?client_id=backstage&redirect_uri=https://portal.example.io/api/auth/oidc-kestrel/handler/frame&response_type=code&scope=openid
  expect:
    status: 302
- id: live-muster-protected-resource
  feature: tool-access
  kind: HTTP
  url: https://muster.kestrel.oakridge.example/.well-known/oauth-protected-resource
  expect:
    status: 200
    bodyContains: '"resource":"https://muster.kestrel.oakridge.example/mcp"'
