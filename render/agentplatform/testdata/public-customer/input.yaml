# A public customer installation: invented names, placeholder values. The hub
# "heron" federates into it; two portal instances sign people in on it; its own
# portal offers a skills repository and the AI chat on the portal's Anthropic key.
input:
  installation:
    name: kestrel
    baseDomain: kestrel.oakridge.example
    customer: oakridge
    provider: capa
    private: false
    chartLine: "3"
    musterClientId: 00000000-0000-4000-8000-000000000001
  secrets: {}
  kagent:
    enabled: true
    modelKeySecret: customer-provided
  identity: {}
  portal:
    enabled: true
    clientIds:
      - portal-client-id-one
      - portal-client-id-two
    skillsRepositories:
      - https://github.com/oakridge-example/agent-skills
    aiChat:
      enabled: true
      model: example-model-medium
      provider: anthropic
  toolAccess:
    agentManager:
      enabled: true
  federation:
    targets: []
    hubs:
      - heron
secrets: {}
