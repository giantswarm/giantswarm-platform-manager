# A public customer installation on the 3 chart line: invented names, placeholder values. Two
# portals sign people in on it — the organisation's own on this installation, its Grafana plugin
# wired, and the fleet hub's ("gopher") — and the hub's muster brokers tokens into it. The
# policy's default components.
input:
  installation:
    name: kestrel
    baseDomain: kestrel.oakridge.example
    customer: oakridge
    provider: capa
    private: false
    chartLine: "3"
    musterClientId: 00000000-0000-4000-8000-000000000001
    podCertificateRequest: false
    portals:
      - installation: kestrel
        customer: oakridge
        domain: portal.kestrel.oakridge.example
        clientId: backstage
        grafanaWired: true
        chartLine: ">=0.244.7 <1.0.0"
      - installation: gopher
        customer: giantswarm
        domain: portal.example.io
        clientId: Yx7hub0portal0client0id0on0record0
        chartLine: ">=2.1.0 <3.0.0"
    federation:
      hubs: [gopher]
      targets: []
secrets: {}
