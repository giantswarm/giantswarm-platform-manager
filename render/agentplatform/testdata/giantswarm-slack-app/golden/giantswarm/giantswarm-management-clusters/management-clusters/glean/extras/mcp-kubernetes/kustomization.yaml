# Rendered by giantswarm-platform-manager, agent-platform definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/giantswarm/management-cluster-bases//extras/mcp-kubernetes?ref=main
  - oauth-credentials.enc.yaml
  - valkey-credentials.enc.yaml
  - dex-client-mcp-kubernetes-secret.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mcp-kubernetes-user-values
    namespace: flux-giantswarm
    files:
      - values=user-values.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: mcp-kubernetes-user-values
          valuesKey: values
    target:
      kind: HelmRelease
      name: mcp-kubernetes
