mcpKubernetes:
  oauth:
    sso:
      allowPrivateIPs: true
    cimd:
      allowPrivateIPs: true
      preRegisteredClientMetadata:
        - client_id: https://muster.glean.example.io/.well-known/oauth-client.json
          client_name: Muster MCP Aggregator
          client_uri: https://github.com/giantswarm/muster
          redirect_uris:
            - https://muster.glean.example.io/oauth/proxy/callback
          grant_types:
