# A Giant Swarm-owned test installation with a Slack app: one the policy's klausGateway.installations
# names, so the chat gateway renders with its generated OBO keys, its Slack credentials supplied at
# commit and the installation's own default agent. Reached through Teleport (private), so Slack
# cannot call in: the gateway connects out in socket mode with the app-level token supplied too, and
# no public route renders. On the 4 chart line, with its own portal beside the hub's ("gopher") and
# the hub's token-exchange client in its Dex. The codename is the policy's; the domain and every
# value are invented.
input:
  installation:
    name: glean
    baseDomain: glean.example.io
    customer: giantswarm
    provider: capz
    private: true
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000004
    podCertificateRequest: true
    portals:
      - installation: gopher
        customer: giantswarm
        domain: portal.example.io
        clientId: Yx7hub0portal0client0id0on0record0
      - installation: glean
        customer: giantswarm
        domain: portal.glean.example.io
        clientId: backstage
    federation:
      hubs: [gopher]
      targets: []
  modelServing:
    enabled: false
secrets:
  klausGateway.slack.bot-token: PLACEHOLDER-SLACK-BOT-TOKEN
  klausGateway.slack.signing-secret: PLACEHOLDER-SLACK-SIGNING-SECRET
  klausGateway.slack.app-token: PLACEHOLDER-SLACK-APP-TOKEN
