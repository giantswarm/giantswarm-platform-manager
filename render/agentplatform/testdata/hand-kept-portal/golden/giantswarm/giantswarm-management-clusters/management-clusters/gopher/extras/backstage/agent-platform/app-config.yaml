# Rendered by giantswarm-platform-manager, agent-platform definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-platform-app-config-backstage
  namespace: backstage
data:
  app-config.agent-platform.yaml: |
    agentPlatform:
      kagent:
        installations:
          gopher: {}
      skills:
        repositories:
          - https://github.com/example/agent-skills
    aiChat:
      anthropic:
        apiKey: $${ANTHROPIC_API_KEY}
      model: claude-opus-4-8
      mcp:
        - name: backstage-actions
          url: https://portal.gopher.example.io/api/mcp-actions/v1
          useBackstageUserToken: true
        - name: muster
          url: https://muster.gopher.example.io/mcp
          authProvider: oidc-gopher
    mcpActions:
      namespacedToolNames: false
    backend:
      actions:
        pluginSources:
          - auth
          - catalog
          - gs
        filter:
          exclude:
            - id: gs:get-pagerduty-ids-for-entity
