- id: live-kagent-api-protected
  feature: identity
  kind: HTTP
  url: https://kagent.gopher.example.io/api/agents
  expect:
    status: 403
- id: live-kagent-login-redirect
  feature: identity
  kind: HTTP
  url: https://kagent.gopher.example.io/oauth2/start
  expect:
    status: 302
    locationContains: client_id=kagent
    note: the login redirects to Dex at https://dex.gopher.example.io/auth as client kagent
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.gopher.example.io/auth?client_id=00000000-0000-4000-8000-000000000002&redirect_uri=https://muster.gopher.example.io/oauth/callback&response_type=code&scope=openid
  expect:
    statuses:
      - 200
      - 302
    dexConnectorStep: true
    note: Dex knows client 00000000-0000-4000-8000-000000000002 and its redirect URI when the connector its /auth answer names redirects to the identity provider or serves its login form; an unknown client answers 404, an unregistered redirect URI 400
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.gopher.example.io/auth?client_id=kagent&redirect_uri=https://kagent.gopher.example.io/oauth2/callback&response_type=code&scope=openid
  expect:
    statuses:
      - 200
      - 302
    dexConnectorStep: true
    note: Dex knows client kagent and its redirect URI when the connector its /auth answer names redirects to the identity provider or serves its login form; an unknown client answers 404, an unregistered redirect URI 400
- id: live-dex-auth-per-client
  feature: identity
  kind: HTTP
  url: https://dex.gopher.example.io/auth?client_id=backstage&redirect_uri=https://portal.gopher.example.io/api/auth/oidc-gopher/handler/frame&response_type=code&scope=openid
  expect:
    statuses:
      - 200
      - 302
    dexConnectorStep: true
    note: Dex knows client backstage and its redirect URI when the connector its /auth answer names redirects to the identity provider or serves its login form; an unknown client answers 404, an unregistered redirect URI 400
- id: live-dex-client-secrets-loaded
  feature: identity
  kind: SecretLoaded
  namespace: giantswarm
  resource: Secret
  name: dex-client-muster
  expect:
    pods: app.kubernetes.io/name=dex
    container: dex
    note: Dex reads the secret of client muster only when its container starts; one started before the Secret changed holds the old secret and the client's sign-ins fail until Dex restarts (dex-app 3.2.3 restarts it on the change)
