  kind: LogAbsent
  namespace: kagent
  resource: Deployment
  name: kagent-oauth2-proxy
  expect:
    absent: audience .* does not match
- id: live-pod-certificate-request
  feature: runtime
  kind: APIServed
  resource: podcertificaterequests.certificates.k8s.io
  expect:
    version: v1beta1
    note: the record enables the feature gates PodCertificateRequest, ClusterTrustBundle, ClusterTrustBundleProjection (the cluster App's values, or its chart's default); the API is served once the control plane has rolled with them, and Agent Substrate's install waits for it
- id: live-drift
  feature: runtime
  kind: Drift
  namespace: flux-giantswarm
  resource: HelmRelease
  name: agent-platform
  expect:
    note: the values the HelmRelease reads from its ConfigMaps are the rendered values
- id: live-kagent-provider-values
  feature: runtime
  kind: Drift
  namespace: flux-giantswarm
  resource: HelmRelease
  name: kagent
  expect:
    note: .spec.values.providers are the rendered kagent.providers (the meta chart forwards its kagent block flat)
    compare:
      - live: spec.values.providers
        rendered: kagent.providers
- id: live-oauth2-proxy-extra-audience
  feature: identity
  kind: Drift
  namespace: kagent
  resource: Deployment
  name: kagent-oauth2-proxy
  expect:
    note: --oidc-extra-audience carries the rendered audiences
    compare:
      - live: spec.template.spec.containers[0].args[args]
        rendered: kagent.oauth2-proxy.extraArgs.oidc-extra-audience
        prefix: --oidc-extra-audience=
