# A Giant Swarm-owned installation without a Slack app on the 4 chart line: the components the
# policy gives the organisation (kagent, the agent-manager, the cluster-manager; no chat gateway,
# since the policy names no Slack app for it), its own portal, the chart range pinned, and the one
# choice made: it serves models. Nothing is supplied at commit; the model key Secret is the
# installation's own. Invented names, placeholder values.
input:
  installation:
    name: gopher
    baseDomain: gopher.example.io
    customer: giantswarm
    provider: capa
    private: false
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000002
    podCertificateRequest: true
    portals:
      - installation: gopher
        customer: giantswarm
        domain: portal.gopher.example.io
        clientId: backstage
        chartLine: ">=2.1.0 <3.0.0"
    federation:
      hubs: []
      targets: []
  # The serving slice is chosen on the hub-private-target shape: the connectivity
  # chart of the 4 line renders it only with a certificate for the models Gateway,
  # which the definition does not name yet (#67), and this shape is the one
  # the render-consumption test renders on the 4 line.
  modelServing:
    enabled: false
secrets: {}
