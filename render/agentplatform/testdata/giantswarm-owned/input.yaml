# A Giant Swarm-owned installation on the 4 chart line: every component the policy gives the
# organisation (kagent with the managed model key, the agent-manager, the chat gateway, the
# cluster-manager), its own portal, the chart range pinned, and the one choice made:
# it serves models. Invented names, placeholder values.
input:
  installation:
    name: gopher
    baseDomain: gopher.example.io
    customer: giantswarm
    provider: capa
    private: false
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000002
    portals:
      - installation: gopher
        customer: giantswarm
        domain: portal.gopher.example.io
    federation:
      hubs: []
      targets: []
  modelServing:
    enabled: true
secrets:
  kagent.modelKey: PLACEHOLDER-MODEL-KEY
  klausGateway.slack.bot-token: PLACEHOLDER-SLACK-BOT-TOKEN
  klausGateway.slack.signing-secret: PLACEHOLDER-SLACK-SIGNING-SECRET
