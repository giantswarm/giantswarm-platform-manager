# A Giant Swarm-owned installation: the login connector pinned, a managed model
# key, an additional model, in-cluster agents trusted through the cluster's
# service-account issuer, the chart range lifted, the chat gateway and the
# cluster-manager the policy offers, a portal with a private skills repository
# and the AI chat on Vertex. Invented names, placeholder values.
input:
  installation:
    name: gopher
    baseDomain: gopher.example.io
    customer: giantswarm
    provider: capa
    private: false
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000002
  secrets: {}
  kagent:
    enabled: true
    modelKeySecret: managed
    defaultModel: example-model-medium
    additionalModelConfigs:
      - name: example-large
        displayName: Example Large
        provider: Anthropic
        model: example-model-large
        apiKeySecret: kagent-anthropic-key
        apiKeySecretKey: ANTHROPIC_API_KEY
        baseUrl: http://agentgateway.agent-platform.svc:8081
  identity:
    loginConnectorId: giantswarm-github
    postLoginRedirectAllowlist:
      - https://portal.example.io/
    trustedIssuers:
      - issuer: https://irsa.gopher.example.io
        jwksUrl: https://irsa.gopher.example.io/keys.json
        allowedAudiences:
          - https://muster.gopher.example.io/mcp
        allowedClaims:
          sub: "system:serviceaccount:kagent:*"
        acceptedTypHeaders:
          - ""
  portal:
    enabled: true
    clientIds:
      - portal-client-id-home
    skillsRepositories:
      - https://github.com/example-org/agent-skills
      - https://github.com/example-org/private-skills
    aiChat:
      enabled: true
      model: example-model-large
      provider: vertex
      google:
        project: example-project
        location: example-location1
  toolAccess:
    agentManager:
      enabled: true
    additionalServers:
      - name: example-tools
        cluster: gopher
        group: example
        url: http://example-tools.agent-platform.svc:8080/mcp
        timeout: 30
        auth:
          mode: forward
  federation:
    targets: []
    hubs: []
  chart:
    semver: ">=4.0.0 <5.0.0"
  muster:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 1Gi
  klausGateway:
    enabled: true
    slack:
      mode: events
      channelMode: allowlist
      channelAllowlist:
        - CEXAMPLE00001
    obo:
      connectors: true
    a2a:
      enabled: true
      defaultAgent: example-agent
      saTokenAudience: kagent
    reviews:
      enabled: true
      allowedCallers:
        - system:serviceaccount:giantswarm-platform-manager:giantswarm-platform-manager
  clusterManager:
    enabled: true
    networkPolicy:
      workloadClusterFqdnPatterns:
        - "api.*.gopher.example.io"
      egressFqdns:
        - matchName: registry.example.io
secrets:
  kagent.modelKey: PLACEHOLDER-MODEL-KEY
  klausGateway.slack.bot-token: PLACEHOLDER-SLACK-BOT-TOKEN
  klausGateway.slack.signing-secret: PLACEHOLDER-SLACK-SIGNING-SECRET
  portal.aiChat.google.credentialsJson: PLACEHOLDER-GOOGLE-CREDENTIALS-JSON
  portal.skillsToken: PLACEHOLDER-SKILLS-TOKEN
