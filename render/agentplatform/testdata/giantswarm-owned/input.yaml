# A Giant Swarm-owned installation without a Slack app, enabled fresh: the capability is not on
# record (agentPlatform false, the default) and its record selects the 3 line (no
# agentPlatform.kagentApiV2 yet), so the enable selects the 4 line — the policy grants the
# organisation the cluster-manager, which the 4 line alone carries — and writes the selection into
# the record (installations/gopher/config.yaml.patch). The components the policy gives the
# organisation (kagent, the agent-manager, the cluster-manager; no chat gateway, since the policy
# names no Slack app for it), its own portal, the chart range pinned. Nothing is supplied at
# commit; the model key Secret is the installation's own. Invented names, placeholder values.
input:
  installation:
    name: gopher
    baseDomain: gopher.example.io
    customer: giantswarm
    provider: capa
    private: false
    chartLine: "3"
    musterClientId: 00000000-0000-4000-8000-000000000002
    podCertificateRequest: true
    portals:
      - installation: gopher
        customer: giantswarm
        domain: portal.gopher.example.io
        clientId: backstage
        chartLine: ">=2.1.0 <3.0.0"
    federation:
      hubs: []
      targets: []
  # The serving slice is chosen on the hub-private-target shape: the connectivity
  # chart of the 4 line renders it only with a certificate for the models Gateway,
  # which the definition does not name yet (#67), and this shape is the one
  # the render-consumption test renders on the 4 line.
  modelServing:
    enabled: false
secrets: {}
