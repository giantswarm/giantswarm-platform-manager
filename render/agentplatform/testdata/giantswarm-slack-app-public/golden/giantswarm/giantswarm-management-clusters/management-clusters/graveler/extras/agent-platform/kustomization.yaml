# Rendered by giantswarm-platform-manager, agent-platform definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/giantswarm/management-cluster-bases//extras/agent-platform?ref=main
  - ./secrets
patches:
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: muster-credentials-revision
        labels:
          reconcile.fluxcd.io/watch: Enabled
    target:
      kind: Secret
      name: muster-credentials-revision
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: kagent-credentials-revision
        labels:
          reconcile.fluxcd.io/watch: Enabled
    target:
      kind: Secret
      name: kagent-credentials-revision
  - patch: |-
      # Held on the running release until the next line lands here as one window
      # (acme/platform#12); back to the range in that PR.
      - op: replace
        path: /spec/ref/semver
        value: "4.114.1"
      - op: add
        path: /spec/ref/semverFilter
        value: "^v?[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$"
    target:
      kind: OCIRepository
      name: agent-platform
