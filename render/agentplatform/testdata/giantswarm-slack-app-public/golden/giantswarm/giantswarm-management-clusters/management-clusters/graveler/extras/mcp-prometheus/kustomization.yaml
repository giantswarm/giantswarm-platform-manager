# Rendered by giantswarm-platform-manager, agent-platform definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/giantswarm/management-cluster-bases//extras/mcp-prometheus?ref=main
  - oauth-credentials.enc.yaml
  - valkey-credentials.enc.yaml
  - credentials-revision.enc.yaml
  - dex-client-mcp-prometheus-secret.yaml
patches:
  - patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: Secret
          name: mcp-prometheus-credentials-revision
          valuesKey: revision
          targetPath: app.oauth.existingSecretChecksum
    target:
      kind: HelmRelease
      name: mcp-prometheus
  - patch: |-
      - op: add
        path: /spec/valuesFrom
        value:
          - kind: Secret
            name: mcp-prometheus-credentials-revision
            valuesKey: revision
            targetPath: valkey.auth.usersExistingSecretChecksum
    target:
      kind: HelmRelease
      name: mcp-prometheus-valkey
