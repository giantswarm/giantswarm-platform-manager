# The registry's hub (the broker's GitHub grant target) with a private target whose agent platform its
# portal proxies, reached through the tunnel, and a public one:
# the broker and the identity provider per target, the targets' MCP servers with exchange auth,
# the credentials Secret per target, the tunnelport release with a RemoteApp per tunnelled app,
# and the hub's entries of teleport-fleet's tunnelport values (the hub as a consumer joining by its
# irsa issuer, its trust-bundle token, one tunnel per tunnelled app). The broker client id is read
# back from the hub's patch. The hub's own Dev Portal signs in on gopher and is hand-kept (its
# app-config carries a literal extension list of its own), so the portal Component renders in the
# hand-kept shape: the object-shaped keys only, none of the lists the portal owns (extensions,
# muster registry, environment). No Slack app is named for the hub, so no chat gateway and nothing
# supplied at commit. Invented names, placeholder values.
input:
  installation:
    name: gopher
    baseDomain: gopher.example.io
    customer: giantswarm
    provider: capa
    private: false
    hub: true
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000002
    podCertificateRequest: true
    portalClientSecret: true
    portals:
      - installation: gopher
        customer: giantswarm
        domain: portal.gopher.example.io
        clientId: backstage
        handKept: true
        chartLine: ">=2.1.0 <3.0.0"
    federation:
      hubs: []
      registryHub: gopher
      brokerClientId: broker-client-id-placeholder
      targets:
        - installation: burrow
          baseDomain: burrow.example.io
          private: true
          platformProxied: true
          hubs: [gopher]
        - installation: marmot
          baseDomain: marmot.example.io
          private: false
          hubs: [gopher]
  modelServing:
    enabled: true
secrets: {}
