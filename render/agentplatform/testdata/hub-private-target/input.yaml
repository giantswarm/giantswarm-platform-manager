# A Giant Swarm-owned hub with a private target reached through the tunnel and a public one:
# the broker and the identity provider per target, the targets' MCP servers with exchange auth,
# the credentials Secret per target, the tunnelport release with a RemoteApp per tunnelled app,
# and the hub's entries of teleport-fleet's tunnelport values (the hub as a consumer joining by its
# irsa issuer, its trust-bundle token, one tunnel per tunnelled app). The broker client id is read
# back from the hub's patch. No Slack app is named for the hub, so no chat gateway and nothing
# supplied at commit. Invented names, placeholder values.
input:
  installation:
    name: gopher
    baseDomain: gopher.example.io
    customer: giantswarm
    provider: capa
    private: false
    chartLine: "4"
    musterClientId: 00000000-0000-4000-8000-000000000002
    podCertificateRequest: true
    portals: []
    federation:
      hubs: []
      brokerClientId: broker-client-id-placeholder
      targets:
        - installation: burrow
          baseDomain: burrow.example.io
          private: true
        - installation: marmot
          baseDomain: marmot.example.io
          private: false
  modelServing:
    enabled: true
secrets: {}
