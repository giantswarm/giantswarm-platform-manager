- id: live-helmrelease-ready
  feature: portal
  kind: HelmReleaseReady
  namespace: flux-giantswarm
  resource: HelmRelease
  name: backstage
- id: live-pods-running
  feature: portal
  kind: PodsRunning
  namespace: backstage
  resource: Pod
  name: app.kubernetes.io/instance=backstage
- id: live-portal-root
  feature: portal
  kind: HTTP
  url: https://portal.hazel.example.test/
  expect:
    status: 200
- id: live-oidc-start
  feature: identity
  kind: HTTP
  url: https://portal.hazel.example.test/api/auth/oidc-hazel/start?env=production
  expect:
    status: 302
    locationContains: https://dex.hazel.example.test/auth
    note: the sign-in redirects to the installation's Dex
- id: live-oidc-start
  feature: identity
  kind: HTTP
  url: https://portal.hazel.example.test/api/auth/oidc-hazel/start?env=production
  expect:
    status: 302
    locationContains: client_id=backstage
    note: the sign-in redirects as the portal's client
- id: live-dex-auth-portal-client
  feature: identity
  kind: HTTP
  url: https://dex.hazel.example.test/auth?client_id=backstage&redirect_uri=https://portal.hazel.example.test/api/auth/oidc-hazel/handler/frame&response_type=code&scope=openid
  expect:
    statuses:
      - 200
      - 302
    note: Dex answers a client it knows with its login page (several connectors) or a redirect to the one connector; an unknown client is an error page
- id: live-values-secrets
  feature: secrets
  kind: ResourcePresent
  namespace: flux-giantswarm
  resource: Secret
  name: user-secrets-backstage
  expect:
    keys:
      - values
- id: live-values-secrets
  feature: secrets
  kind: ResourcePresent
  namespace: flux-giantswarm
  resource: Secret
  name: plugin-keys-backstage
  expect:
    keys:
      - values
- id: live-values-secrets
  feature: secrets
  kind: ResourcePresent
  namespace: flux-giantswarm
  resource: Secret
  name: github-app-credentials-backstage
  expect:
    keys:
      - values
- id: live-dex-client-secret
  feature: secrets
  kind: ResourcePresent
  namespace: giantswarm
  resource: Secret
  name: dex-client-backstage
  expect:
    keys:
      - secret
- id: live-platform-fragment
  feature: agent-platform-section
  kind: ResourcePresent
  namespace: backstage
  resource: ConfigMap
  name: agent-platform-app-config-backstage
