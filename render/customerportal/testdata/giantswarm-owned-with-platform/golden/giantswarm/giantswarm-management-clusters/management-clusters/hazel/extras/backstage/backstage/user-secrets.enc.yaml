apiVersion: v1
kind: Secret
metadata:
  name: user-secrets-backstage
  namespace: flux-giantswarm
  labels:
    application.giantswarm.io/team: bumblebee
type: Opaque
stringData:
  values: |
    authSessionSecret: GENERATED(backstage-session-secret)
    dexAuthCredentials:
      hazel:
        clientID: backstage
        clientSecret: GENERATED(backstage-dex-client-secret)
    telemetrydeck:
      salt: GENERATED(backstage-telemetrydeck-salt)
    sentry:
      app:
        dsn: https://placeholder@sentry.example.test/1
      backend:
        dsn: https://placeholder@sentry.example.test/2
      reportURI: https://sentry.example.test/api/1/security/?sentry_key=placeholder
