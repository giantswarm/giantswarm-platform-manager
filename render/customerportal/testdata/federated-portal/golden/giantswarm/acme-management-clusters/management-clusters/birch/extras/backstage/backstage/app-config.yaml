# Rendered by giantswarm-platform-manager, customer-portal definition. Do not edit by hand:
# the next reconcile writes it again from the installation's inputs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-backstage
  namespace: flux-giantswarm
data:
  values: |
    backstage:
      appConfig: |
        app:
          title: Dev Portal
          baseUrl: https://portal.birch.acme.example.test
          extensions:
            $include: shared-config.yaml#extensions
          routes:
            $include: shared-config.yaml#routes
        organization:
          name: ACME
        backend:
          auth:
            pluginKeyStore:
              type: static
              static:
                keys:
                  - publicKeyFile: /app/plugin-keys/plugin-to-plugin/public.key
                    privateKeyFile: /app/plugin-keys/plugin-to-plugin/private.key
                    keyId: plugin-to-plugin
          baseUrl: https://portal.birch.acme.example.test
          listen:
            port: 7007
            host: 0.0.0.0
          cors:
            origin: https://portal.birch.acme.example.test
            methods:
              - GET
              - HEAD
              - PATCH
              - POST
              - PUT
              - DELETE
            credentials: true
          csp:
            connect-src:
              $include: shared-config.yaml#csp.connectSrc
            img-src:
              $include: shared-config.yaml#csp.imgSrc
            script-src:
              $include: shared-config.yaml#csp.scriptSrc
            worker-src:
              $include: shared-config.yaml#csp.workerSrc
          database:
            client: better-sqlite3
            connection: ':memory:'
          cache:
            store: memory
          reading:
            allow:
              - host: '*.birch.acme.example.test'
        permission:
          enabled: true
        techdocs:
          builder: local
          generator:
            runIn: local
          publisher:
            type: local
        kubernetes:
          serviceLocatorMethod:
            type: multiTenant
          clusterLocatorMethods:
            - type: config
              clusters:
                - name: alder
                  url: https://happaapi.alder.acme.example.test
                  authProvider: oidc
                  oidcTokenProvider: oidc-alder
                - name: birch
                  url: https://happaapi.birch.acme.example.test
                  authProvider: oidc
                  oidcTokenProvider: oidc-birch
                - name: cedarwood
                  url: https://happaapi.cedarwood.acme.example.test
                  authProvider: oidc
                  oidcTokenProvider: oidc-cedarwood
        auth:
          environment: production
          session:
            secret: $${AUTH_SESSION_SECRET}
          providers:
            oidc-alder:
              development:
                metadataUrl: https://dex.alder.acme.example.test/.well-known/openid-configuration
                clientId: $${AUTH_DEX_ALDER_CLIENT_ID}
                clientSecret: $${AUTH_DEX_ALDER_CLIENT_SECRET}
              production:
                metadataUrl: https://dex.alder.acme.example.test/.well-known/openid-configuration
                clientId: $${AUTH_DEX_ALDER_CLIENT_ID}
                clientSecret: $${AUTH_DEX_ALDER_CLIENT_SECRET}
        grafana:
          hosts:
            - id: birch
              domain: https://grafana.birch.acme.example.test
        gs:
          authProvider: oidc-alder
          auth:
            extraScopes:
              $include: shared-config.yaml#auth.extraScopes
          clusterTokenBroker:
            clientId: $${AUTH_DEX_MUSTER_BROKER_CLIENT_ID}
            clientSecret: $${AUTH_DEX_MUSTER_BROKER_CLIENT_SECRET}
            tokenUrl: https://muster.alder.acme.example.test/oauth/token
          friendlyLabels:
            - key: Service priority
              selector: acme.example.test/service-priority
              valueMap:
                highest: Highest
                lowest: Lowest
                medium: Medium
            - selector: team-*
              variant: blue
          friendlyAnnotations:
            - key: Owner
              selector: acme.example.test/owner
          installations:
            alder:
              authProvider: oidc
              baseDomain: alder.acme.example.test
              oidcTokenProvider: oidc-alder
              pipeline: stable
              providers:
                - capa
              region: example-region-2
            birch:
              authProvider: oidc
              baseDomain: birch.acme.example.test
              clusterTokenAudience: birch
              oidcTokenProvider: oidc-birch
              pipeline: stable
              providers:
                - capa
                - capv
              region: example-region-1
            cedarwood:
              authProvider: oidc
              baseDomain: cedarwood.acme.example.test
              clusterTokenAudience: cedarwood
              oidcTokenProvider: oidc-cedarwood
              pipeline: testing
              providers:
                - cloud-director
          adminGroups:
            $include: shared-config.yaml#adminGroups
          kubernetesVersions:
            $include: shared-config.yaml#kubernetesVersions
        catalog:
          $include: shared-config.yaml#catalog
