apiVersion: v1
kind: Secret
metadata:
  name: user-secrets-backstage
  namespace: flux-giantswarm
type: Opaque
stringData:
  values: |
    authSessionSecret: GENERATED(backstage-session-secret)
    dexAuthCredentials:
      birch:
        clientID: backstage
        clientSecret: GENERATED(backstage-dex-client-secret)
      alder:
        clientID: placeholder-alder-client-id
        clientSecret: placeholder-alder-client-secret
      musterBroker:
        clientID: placeholder-broker-client-id
        clientSecret: placeholder-broker-client-secret
    telemetrydeck:
      salt: GENERATED(backstage-telemetrydeck-salt)
