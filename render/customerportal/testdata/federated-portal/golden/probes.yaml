- id: live-helmrelease-ready
  feature: portal
  kind: HelmReleaseReady
  namespace: flux-giantswarm
  resource: HelmRelease
  name: backstage
- id: live-pods-running
  feature: portal
  kind: PodsRunning
  namespace: backstage
  resource: Pod
  name: app.kubernetes.io/instance=backstage
- id: live-portal-root
  feature: portal
  kind: HTTP
  url: https://portal.birch.acme.example.test/
  expect:
    status: 200
- id: live-oidc-start
  feature: identity
  kind: HTTP
  url: https://portal.birch.acme.example.test/api/auth/oidc-alder/start?env=production
  expect:
    status: 302
    locationContains: https://dex.birch.acme.example.test/auth
    note: the sign-in redirects to the installation's Dex
- id: live-oidc-start
  feature: identity
  kind: HTTP
  url: https://portal.birch.acme.example.test/api/auth/oidc-alder/start?env=production
  expect:
    status: 302
    locationContains: client_id=backstage
    note: the sign-in redirects as the portal's client
- id: live-dex-auth-portal-client
  feature: identity
  kind: HTTP
  url: https://dex.birch.acme.example.test/auth?client_id=backstage&redirect_uri=https://portal.birch.acme.example.test/api/auth/oidc-birch/handler/frame&response_type=code&scope=openid
  expect:
    statuses:
      - 200
      - 302
    dexConnectorStep: true
    note: Dex knows client backstage and its redirect URI when the connector its /auth answer names redirects to the identity provider or serves its login form; an unknown client answers 404, an unregistered redirect URI 400
- id: live-dex-portal-secret-loaded
  feature: identity
  kind: SecretLoaded
  namespace: giantswarm
  resource: Secret
  name: dex-client-backstage
  expect:
    pods: app.kubernetes.io/name=dex
    container: dex
    note: Dex reads the secret of client backstage only when its container starts; one started before the Secret changed holds the old secret and the client's sign-ins fail until Dex restarts (dex-app 3.2.3 restarts it on the change)
- id: live-values-secrets
  feature: secrets
  kind: ResourcePresent
  namespace: flux-giantswarm
  resource: Secret
  name: user-secrets-backstage
  expect:
    keys:
      - values
- id: live-values-secrets
  feature: secrets
  kind: ResourcePresent
  namespace: flux-giantswarm
  resource: Secret
  name: plugin-keys-backstage
  expect:
    keys:
      - values
- id: live-dex-client-secret
  feature: secrets
  kind: ResourcePresent
  namespace: giantswarm
  resource: Secret
  name: dex-client-backstage
  expect:
    keys:
      - secret
