# A customer's portal over three installations on the 0.x chart line: the
# portal runs on one, people sign in through a second one's Dex, whose muster
# also brokers cluster tokens for the other two (so the portal has that one
# Dex provider) and which alone runs the agent platform (so the portal's
# environment names that installation's avatars host, its own running none);
# one installation runs clusters on two providers; friendly labels on the
# cluster pages. No plugins beyond the always-on ones. Invented names,
# placeholder values.
input:
  installation:
    name: birch
    baseDomain: birch.acme.example.test
    customer: acme
    provider: capa
    providers: [capa, capv]
    region: example-region-1
    pipeline: stable
    agentPlatform: false
  portal:
    domain: portal.birch.acme.example.test
    organization: ACME
    friendlyLabels:
      - key: Service priority
        selector: acme.example.test/service-priority
        valueMap: {highest: Highest, medium: Medium, lowest: Lowest}
      - selector: "team-*"
        variant: blue
    friendlyAnnotations:
      - key: Owner
        selector: acme.example.test/owner
  chart:
    line: ">=0.244.7 <1.0.0"
  plugins:
    github: {enabled: false}
    grafana: {enabled: false}
    flux: {enabled: false}
    sentry: {enabled: false}
  tunnel:
    enabled: false
  federation:
    installations:
      - name: alder
        baseDomain: alder.acme.example.test
        providers: [capa]
        region: example-region-2
        pipeline: stable
        agentPlatform: true
      - name: cedarwood
        baseDomain: cedarwood.acme.example.test
        providers: [cloud-director]
        pipeline: testing
        agentPlatform: false
        private: true
    signInInstallation: alder
    tokenBroker: alder
secrets:
  federation.alder.clientId: placeholder-alder-client-id
  federation.alder.clientSecret: placeholder-alder-client-secret
  federation.tokenBroker.clientId: placeholder-broker-client-id
  federation.tokenBroker.clientSecret: placeholder-broker-client-secret
