type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/giantswarm/giantswarm-platform-manager
icon: https://s.giantswarm.io/app-icons/giantswarm/1/dark.svg
sources:
  - https://github.com/giantswarm/giantswarm-platform-manager
keywords:
  - mcp
  - installations
  - capabilities
  - gitops
  - agent-platform
maintainers:
