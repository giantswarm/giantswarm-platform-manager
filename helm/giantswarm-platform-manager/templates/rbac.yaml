{{- if .Values.actions.enabled }}
# The manager reads and writes its own Action records, in its namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "giantswarm-platform-manager.fullname" . }}-actions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giantswarm-platform-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["platform-manager.giantswarm.io"]
    resources: ["actions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["platform-manager.giantswarm.io"]
    resources: ["actions/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "giantswarm-platform-manager.fullname" . }}-actions
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giantswarm-platform-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "giantswarm-platform-manager.fullname" . }}-actions
subjects:
  - kind: ServiceAccount
    name: {{ include "giantswarm-platform-manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
