{{- if and .Values.muster.liveServer.enabled (not .Values.live.enabled) }}
{{- fail "muster.liveServer.enabled registers the live path with muster, and live.enabled, which serves it, is off: set live.enabled in a release of its own first, then muster.liveServer.enabled — muster probes a registration once, and a probe that finds no path at the URL leaves the registration failed until it is restarted (giantswarm/muster#1295)" }}
{{- end }}
{{- if and .Values.muster.mcpServer.enabled .Values.muster.liveServer.enabled .Values.oauth.enabled }}
{{- /*
The second registration of the same Deployment, split from the first by
authority: muster forwards the person's own ID token to it (forwardToken) and
runs no consent, so its tools — verify_installation, watch_action — read an installation
through muster's kubernetes tools as the person, with the person's access on
that installation. Tools appear as x_<name>_<tool>. No authorizationServer:
the two exclude each other on one MCPServer, which is why the manager is
registered twice. requiredAudiences are what muster asks the identity
provider for at login, so every forwarded token carries them; the server
trusts them next to live.audiences. The path it names is served by the
Deployment on live.enabled, in a release before this registration: muster
probes a registration once, and the probe has to find the path answering
(a 401 with the challenge reads Auth Required; no path reads failed).
*/}}
apiVersion: muster.giantswarm.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.muster.liveServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    muster.giantswarm.io/type: giantswarm-platform-manager
    {{- include "giantswarm-platform-manager.labels" . | nindent 4 }}
    {{- with .Values.muster.mcpServer.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  autoStart: {{ .Values.muster.mcpServer.autoStart }}
  type: streamable-http
  timeout: {{ .Values.muster.liveServer.timeout }}
  url: {{ include "giantswarm-platform-manager.serviceURL" . }}{{ .Values.live.path }}
  {{- with .Values.muster.liveServer.description }}
  description: {{ . | quote }}
  {{- end }}
  auth:
    type: oauth
    forwardToken: true
    {{- with .Values.muster.liveServer.requiredAudiences }}
    requiredAudiences:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
