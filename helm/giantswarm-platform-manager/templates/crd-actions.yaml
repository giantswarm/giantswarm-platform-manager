{{- if and .Values.actions.enabled .Values.actions.installCRD }}
# The Action record: one per enablement or reconcile a person commits. The
# spec is written once by the commit; the status (a subresource) follows the
# pull requests, the approval, the rollout, the probes and the result.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actions.platform-manager.giantswarm.io
  labels:
    {{- include "giantswarm-platform-manager.labels" . | nindent 4 }}
spec:
  group: platform-manager.giantswarm.io
  scope: Namespaced
  names:
    kind: Action
    listKind: ActionList
    plural: actions
    singular: action
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Capability
          type: string
          jsonPath: .spec.capability
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Actor
          type: string
          jsonPath: .spec.actor.login
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [actor, capability, installations, kind]
              properties:
                actor:
                  description: The person the action ran as — the GitHub login, id and email of the token the call carried; the email names the actor on the review.
                  type: object
                  required: [login]
                  properties:
                    login: {type: string}
                    id: {type: integer, format: int64}
                    email: {type: string}
                capability:
                  description: The capability acted on.
                  type: string
                kind:
                  description: enable, reconcile or disable.
                  type: string
                  enum: [enable, reconcile, disable]
                customer:
                  description: A customer installation is among the targets; the notice channel is told once its change is applied.
                  type: boolean
                accountEngineers:
                  description: The account engineers the installations catalog records for the customer installations targeted, in the installations' order without repeats; the review names them.
                  type: array
                  items: {type: string}
                accountEngineerOf:
                  description: Each customer installation among the targets and its account engineer; the notice once its change is applied names them.
                  type: object
                  additionalProperties: {type: string}
                reason:
                  description: Why the actor commits the change, in their words; the review's and the notices' why.
                  type: string
                change:
                  description: The plan's change in one clause, on the record and in the pull requests; never a value.
                  type: string
                changes:
                  description: Per installation, what the commit changes as a person reads it, one line per component (new, versions, values keys, rotated credentials); never a secret value.
                  type: object
                  additionalProperties:
                    type: array
                    items: {type: string}
                rotate:
                  description: The generated values the person asked to rotate, by name; the review names them apart from the rotations a file to write forced. Names only.
                  type: array
                  items: {type: string}
                installations:
                  description: The installations of the set, in the wave's order.
                  type: array
                  items: {type: string}
                skipped:
                  description: The installations of the set a wave left out, and why; never a target.
                  type: array
                  items:
                    type: object
                    required: [name, reason]
                    properties:
                      name: {type: string}
                      reason: {type: string}
                inputs:
                  description: The typed inputs of the action as given, merged over the facts on record; never a secret value.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                inputsByInstallation:
                  description: The inputs each installation of the set was rendered from at commit, the typed inputs over the facts on record, by installation; never a secret value.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                keptByInstallation:
                  description: Per installation, the entries of the platform patch's audience lists the commit kept beside the render; the live probes hold the objects against the render with them. Ids only, never a secret value.
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      properties:
                        list: {type: string}
                        entry: {type: string}
                markers:
                  description: Per installation, the definition's enabled marker resolved to the installation's repository (owner/repo:path), whose absence from the default branch after the merge means the fileset was reverted.
                  type: object
                  additionalProperties: {type: string}
            status:
              type: object
              properties:
                state:
                  description: The action's state, one of the installations' states an action produces, or the action's own — refused (the gate refused it before any write — the installation unreadable as the person, or without repositories on record), denied (a member withdrew it before its merge), reverted (a merged pull request of it was reverted on the default branch), withdrawn (its actor withdrew it after the merge, with the reason), removed (the fileset it wrote left the default branch again), disabled (a disable merged and the capability's marker left the default branch).
                  type: string
                  enum: ["pending approval", "ready to merge", "rolling out", "waiting for the customer", enabled, drifted, failed, refused, denied, reverted, withdrawn, removed, disabled]
                pullRequests:
                  type: array
                  items:
                    type: object
                    required: [repository, number]
                    properties:
                      installation: {type: string}
                      repository: {type: string}
                      number: {type: integer}
                      url: {type: string}
                      state: {type: string}
                      head: {type: string}
                      headSha: {type: string}
                      mergeCommit: {type: string}
                      mergedAt: {type: string, format: date-time}
                      mergedBy: {type: string}
                      closedAt: {type: string, format: date-time}
                      revert:
                        description: The commit on the default branch that brought every file the merge changed back to its content before the merge, with the pull request it came through when GitHub links one.
                        type: object
                        required: [commit]
                        properties:
                          commit: {type: string}
                          url: {type: string}
                          pullRequest: {type: integer}
                          pullRequestUrl: {type: string}
                          at: {type: string, format: date-time}
                rotated:
                  description: The generated values the commit drew anew over a value on record, by name — a new file needed a value frozen in an existing encrypted file, so every file of the name got the new one.
                  type: array
                  items: {type: string}
                approval:
                  type: object
                  properties:
                    channel: {type: string}
                    reviewId: {type: string}
                    noticeChannel: {type: string}
                    postedAt: {type: string, format: date-time}
                    decision: {type: string}
                    decidedBy: {type: string}
                    reason: {type: string}
                    at: {type: string, format: date-time}
                rollout:
                  type: object
                  properties:
                    startedAt: {type: string, format: date-time}
                    finishedAt: {type: string, format: date-time}
                    installations:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string}
                          state: {type: string}
                          message: {type: string}
                          objects:
                            description: The Flux objects of the rollout as the last watch read them, each with its Ready condition and revision.
                            type: array
                            items:
                              type: object
                              required: [kind, name]
                              properties:
                                kind: {type: string}
                                namespace: {type: string}
                                name: {type: string}
                                ready: {type: string}
                                revision: {type: string}
                                message: {type: string}
                          watchedAt: {type: string, format: date-time}
                          watchedBy: {type: string}
                          reportedAt: {type: string, format: date-time}
                          noticedAt: {type: string, format: date-time}
                probes:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: {type: string}
                      installation: {type: string}
                      result: {type: string}
                      message: {type: string}
                      at: {type: string, format: date-time}
                result:
                  type: object
                  required: [state]
                  properties:
                    state: {type: string}
                    message: {type: string}
                    at: {type: string, format: date-time}
                syncedAt:
                  description: When the record last followed GitHub — the pull requests and the merged stages' markers read — and as whom (syncedBy), the person reading the record.
                  type: string
                  format: date-time
                syncedBy: {type: string}
                orphans:
                  description: On a removed action whose definition's Kustomization does not prune, the objects the definition rendered on the installations that stay until a person deletes them.
                  type: array
                  items:
                    type: object
                    required: [installation, kind, name]
                    properties:
                      installation: {type: string}
                      kind: {type: string}
                      namespace: {type: string}
                      name: {type: string}
                      takes: {type: string}
                withdrawal:
                  description: The actor's withdrawal of a merged action that failed or was reverted — who, why and when; the review's thread carries the same.
                  type: object
                  required: [by, reason]
                  properties:
                    by: {type: string}
                    reason: {type: string}
                    at: {type: string, format: date-time}
{{- end }}
