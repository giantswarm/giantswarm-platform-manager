{{- if and .Values.actions.enabled .Values.actions.installCRD }}
# The Action record: one per enablement or reconcile a person commits. The
# spec is written once by the commit; the status (a subresource) follows the
# pull requests, the approval, the rollout, the probes and the result.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actions.platform-manager.giantswarm.io
  labels:
    {{- include "giantswarm-platform-manager.labels" . | nindent 4 }}
spec:
  group: platform-manager.giantswarm.io
  scope: Namespaced
  names:
    kind: Action
    listKind: ActionList
    plural: actions
    singular: action
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Capability
          type: string
          jsonPath: .spec.capability
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Actor
          type: string
          jsonPath: .spec.actor.login
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [actor, capability, installations, kind]
              properties:
                actor:
                  description: The person the action ran as — the GitHub login, id and email of the token the call carried; the email names the actor on the review.
                  type: object
                  required: [login]
                  properties:
                    login: {type: string}
                    id: {type: integer, format: int64}
                    email: {type: string}
                capability:
                  description: The capability acted on.
                  type: string
                kind:
                  description: enable or reconcile.
                  type: string
                  enum: [enable, reconcile]
                customer:
                  description: The target is a customer installation; the notice channel is told of the review.
                  type: boolean
                change:
                  description: The plan's change in one clause, as the review states it; never a value.
                  type: string
                installations:
                  description: The installations of the set, in the wave's order.
                  type: array
                  items: {type: string}
                skipped:
                  description: The installations of the set a wave left out, and why; never a target.
                  type: array
                  items:
                    type: object
                    required: [name, reason]
                    properties:
                      name: {type: string}
                      reason: {type: string}
                inputs:
                  description: The typed inputs of the action as given, merged over the facts on record; never a secret value.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                inputsByInstallation:
                  description: The inputs each installation of the set was rendered from at commit, the typed inputs over the facts on record, by installation; never a secret value.
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                state:
                  description: The action's state, one of the installations' states an action produces, or refused (the opt-in gate refused it before any write).
                  type: string
                  enum: ["pending approval", "rolling out", "waiting for the customer", enabled, drifted, failed, refused, denied]
                pullRequests:
                  type: array
                  items:
                    type: object
                    required: [repository, number]
                    properties:
                      installation: {type: string}
                      repository: {type: string}
                      number: {type: integer}
                      url: {type: string}
                      state: {type: string}
                      head: {type: string}
                      headSha: {type: string}
                approval:
                  type: object
                  properties:
                    channel: {type: string}
                    reviewId: {type: string}
                    noticeChannel: {type: string}
                    postedAt: {type: string, format: date-time}
                    decision: {type: string}
                    decidedBy: {type: string}
                    reason: {type: string}
                    at: {type: string, format: date-time}
                rollout:
                  type: object
                  properties:
                    startedAt: {type: string, format: date-time}
                    finishedAt: {type: string, format: date-time}
                    installations:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string}
                          state: {type: string}
                          message: {type: string}
                probes:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: {type: string}
                      installation: {type: string}
                      result: {type: string}
                      message: {type: string}
                      at: {type: string, format: date-time}
                result:
                  type: object
                  required: [state]
                  properties:
                    state: {type: string}
                    message: {type: string}
                    at: {type: string, format: date-time}
{{- end }}
