apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "giantswarm-platform-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giantswarm-platform-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "giantswarm-platform-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "giantswarm-platform-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "giantswarm-platform-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:8080
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: MCP_PATH
              value: {{ .Values.mcp.path | quote }}
            {{- if .Values.oauth.enabled }}
            - name: OAUTH_ENABLED
              value: "true"
            - name: OAUTH_BASE_URL
              value: {{ include "giantswarm-platform-manager.oauthBaseURL" . | quote }}
            - name: OAUTH_AUTHORIZATION_SERVER
              value: {{ .Values.muster.mcpServer.auth.authorizationServer.issuer | quote }}
            {{- end }}
            {{- if .Values.live.enabled }}
            - name: LIVE_ENABLED
              value: "true"
            - name: LIVE_PATH
              value: {{ .Values.live.path | quote }}
            - name: LIVE_ISSUER
              value: {{ required "live.issuer is required with live.enabled" .Values.live.issuer | quote }}
            - name: LIVE_AUDIENCES
              value: {{ required "live.audiences must name at least one OAuth client (or muster.liveServer.requiredAudiences one audience) with live.enabled" (include "giantswarm-platform-manager.liveAudiences" .) | quote }}
            {{- with .Values.live.jwksURL }}
            {{- if not (hasPrefix "https://" .) }}
            {{- fail (printf "live.jwksURL must be an https:// URL, got %q: the key set is read over TLS only — name an in-cluster identity provider by the Service name its certificate carries, with live.allowPrivateIPJWKS for the private address and live.caSecret for its CA" .) }}
            {{- end }}
            - name: LIVE_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.live.allowPrivateIPJWKS }}
            - name: LIVE_ALLOW_PRIVATE_IP_JWKS
              value: "true"
            {{- end }}
            {{- if .Values.live.caSecret }}
            - name: LIVE_CA_FILE
              value: /etc/giantswarm-platform-manager/live-ca/ca.crt
            {{- end }}
            - name: MUSTER_URL
              value: {{ include "giantswarm-platform-manager.musterURL" . | quote }}
            - name: LIVE_KUBERNETES_FAMILY
              value: {{ .Values.live.muster.kubernetesFamily | quote }}
            - name: LIVE_KUBERNETES_INSTANCE_ARG
              value: {{ .Values.live.muster.kubernetesInstanceArg | quote }}
            - name: LIVE_KUBERNETES_MEMBER
              value: {{ .Values.live.muster.kubernetesMember | quote }}
            {{- end }}
            {{- with .Values.github.apiURL }}
            - name: GITHUB_API_URL
              value: {{ . | quote }}
            {{- end }}
            - name: REGISTRY_REPOSITORY
              value: {{ .Values.registry.repository | quote }}
            - name: REGISTRY_PATH
              value: {{ .Values.registry.path | quote }}
            {{- with .Values.hub }}
            - name: HUB_INSTALLATION
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.actions.enabled }}
            - name: ACTIONS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.approvals.gatewayURL }}
            - name: APPROVALS_URL
              value: {{ .Values.approvals.gatewayURL | quote }}
            - name: APPROVALS_CHANNEL
              value: {{ .Values.approvals.channel | quote }}
            - name: APPROVALS_TEAM
              value: {{ .Values.approvals.team | quote }}
            - name: APPROVALS_NOTICE_CHANNEL
              value: {{ .Values.approvals.noticeChannel | quote }}
            - name: APPROVALS_TOKEN_FILE
              value: /var/run/secrets/klaus-gateway/token
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.approvals.gatewayURL }}
            - name: gateway-token
              mountPath: /var/run/secrets/klaus-gateway
              readOnly: true
            {{- end }}
            {{- if and .Values.live.enabled .Values.live.caSecret }}
            - name: live-ca
              mountPath: /etc/giantswarm-platform-manager/live-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.approvals.gatewayURL }}
        # The bearer of the review requests: a token for the gateway's audience,
        # rotated by the kubelet and read on every call.
        - name: gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.approvals.audience | quote }}
                  expirationSeconds: 600
                  path: token
        {{- end }}
        {{- if and .Values.live.enabled .Values.live.caSecret }}
        # The CA the identity provider's certificate chains to, for the key
        # set the forwarded tokens are checked against.
        - name: live-ca
          secret:
            secretName: {{ .Values.live.caSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
