# The platform shape on top of tests/test-values.yaml: registered with muster
# in oauth mode, pinned to the GitHub App giantswarm-platform-manager.
#
#   helm template giantswarm-platform-manager helm/giantswarm-platform-manager \
#     -f tests/test-values.yaml -f tests/oauth-values.yaml -s templates/mcpserver.yaml
#
# renders the MCPServer with the pin; the Deployment carries OAUTH_ENABLED,
# OAUTH_BASE_URL and OAUTH_AUTHORIZATION_SERVER. The live registration
# (`muster.liveServer`, templates/mcpserver-live.yaml) takes the
# installation's own Dex issuer and the clients people sign in with under
# `live`, and requires the cross-client audience the platform's other
# forwarded-token servers require; the Deployment's LIVE_AUDIENCES is the
# union. An installation's values name them.
oauth:
  enabled: true
live:
  enabled: true
  issuer: https://dex.example.test/dex
  audiences:
    - agent-platform
muster:
  liveServer:
    enabled: true
    requiredAudiences:
      - dex-k8s-authenticator
  mcpServer:
    enabled: true
