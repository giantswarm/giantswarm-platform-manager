    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
  - key: extras:agent-platform/secrets/kustomization.yaml resources[<name>-token-exchange-credentials.yaml]
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
  - key: extras:agent-platform/secrets/muster-broker-clients.yaml
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
  - key: extras:agent-platform/secrets/kustomization.yaml resources[muster-broker-clients.yaml]
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
  - key: configmap:muster.muster.oauth.server.tokenExchangeBroker.brokerClients.<name>.clientCredentialsSecretRef
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
  - key: configmap:muster.muster.oauth.server.tokenExchangeBroker.targets.<name>.clientCredentialsSecretRef
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files

