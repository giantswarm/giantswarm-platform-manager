# Keys the definition renders that an installation enabled before a migration lacks. Their absence from the
# record is the migration's planned addition, not drift: the comparison marks a leaf the definition renders
# and the record does not have, under one of these keys, planned with the reason. A leaf the record holds
# with another value stays a difference. Key paths use the file prefixes and the normalisation of
# removals.yaml ([*] for a list index, <name> for a map key or a part of a file or entry name). The
# comparison takes the first key that names a path: a more specific key precedes one that covers it.
# An entry of a scalar the plan merges as a comma-separated set (kagent's oidc-extra-audience) is
# addressed like a list entry, <path>[<entry>]: a scalar on record whose only change is entries named
# this way is planned with their reasons; an entry not named, or one removed, keeps it a difference.
#
# The reason is what the Dev Portal shows a platform engineer next to the planned change, so it is one
# sentence in their words: what is on the installation today, what replaces it and why. It starts with
# Added: or Moved:, names the chart line, the value or the object, never the file (the file is the group
# the change is listed under), and carries the migration as a trailing tag (· M<n>). A key with a
# placeholder names the concrete instance through its reason: a placeholder the key declares, referenced in
# the reason, is filled with the part of the path that matched ("the mcp-<name> server" reads "the
# mcp-prometheus server"), and a placeholder the key declares twice stands for one value.
#
# The M numbers are the wave-1 migration list's (M1–M11) and continue removals.yaml's (M30…).
migrations:
  # --- M36 — a changed portal fragment rolls the portal ---
  - key: backstage:agent-platform/values:backstage.extraAppConfig[*].checksum
    reason: "Added: the Agent Platform Component's fragment mount carries the sha256 of the fragment, which the portal's chart (backstage 2.60.2 or later) renders as a pod annotation, so a changed fragment restarts the portal instead of waiting for a hand-run restart · M36"
  # --- M35 — a rotated server credential rolls the server and its Valkey ---
  # The revision is one generated value per server, held by its credentials Secret, its Valkey's and the
  # revision Secret beside the HelmReleases; a rewrite of either credentials file draws it anew.
  - key: extras:mcp-<name>/credentials-revision.enc.yaml
    reason: "Added: the mcp-<name> server gets a credentials revision, a generated mark drawn anew with every rotation of its credentials, in the Secret mcp-<name>-credentials-revision beside its HelmReleases, which read it into their charts' checksum values so the server and its Valkey restart on rotated credentials instead of keeping the old ones until a hand-run restart · M35"
  - key: extras:mcp-<name>/kustomization.yaml resources[credentials-revision.enc.yaml]
    reason: "Added: the mcp-<name> server's kustomization lists credentials-revision.enc.yaml, so the revision Secret is applied with the server · M35"
  - key: extras:mcp-<name>/kustomization.yaml patches
    reason: "Added: the mcp-<name> server's HelmRelease and its Valkey's read the credentials revision from the Secret mcp-<name>-credentials-revision into their charts' checksum values (valuesFrom with targetPath), which the charts render as pod annotations, so a rotation restarts both pods and nothing else · M35"
  - key: extras:mcp-<name>/oauth-credentials.enc.yaml stringData.CREDENTIALS_REVISION
    reason: "Added: the mcp-<name> server's credentials Secret carries the credentials revision (CREDENTIALS_REVISION), so a rewrite of the Secret draws the revision anew and the server and its Valkey restart with it · M35"
  - key: extras:mcp-<name>/oauth-credentials.enc.yaml stringData.credentials-revision
    reason: "Added: the mcp-<name> server's credentials Secret carries the credentials revision (credentials-revision), so a rewrite of the Secret draws the revision anew and the server and its Valkey restart with it · M35"
  - key: extras:mcp-<name>/valkey-credentials.enc.yaml stringData.revision
    reason: "Added: the mcp-<name> server's Valkey Secret carries the credentials revision (revision), so a rewrite of the Secret draws the revision anew and the server and its Valkey restart with it · M35"
  # --- M34 — kagent's default ModelConfig gets an output cap per call ---
  - key: configmap:kagent.providers.anthropic.config.maxTokens
    reason: "Added: kagent's default ModelConfig caps one call's output at 32000 tokens instead of kagent's 8192, which the model's thinking shares with its visible answer and cut long answers mid-sentence; the same bound on every installation running kagent · M34"
  # --- M32 — a spoke's Dex carries the hub's token-exchange client, its secret referenced; the hub's federation files ---
  # The client's id is the fleet's, muster-token-exchange-<installation> for the registry's hub and
  # muster-token-exchange-<installation>-<hub> for every other hub: the id the hub's credentials Secret presents.
  - key: dex-configmap:oidc.extraStaticClients[muster-token-exchange-<name>]
    reason: "Added: Dex gets the client muster-token-exchange-<name>, a hub's token-exchange client in this installation's Dex under the id the hub's credentials present, through which the hub's muster exchanges a person's token for one this installation accepts · M32"
  - key: dex-configmap:oidc.staticClients.dexK8SAuthenticator.trustedPeers[muster-token-exchange-<name>]
    reason: "Added: the dex-k8s-authenticator client trusts the hub's token-exchange client muster-token-exchange-<name> as a peer, so a token the hub exchanges can carry this installation's cluster audience · M32"
  - key: extras:agent-platform/secrets/dex-client-muster-token-exchange-<name>-secret.yaml
    reason: "Added: the hub's token-exchange client muster-token-exchange-<name> in this installation's Dex reads its secret from its own Secret under extras/agent-platform/secrets instead of an inline value · M32"
  - key: extras:agent-platform/secrets/kustomization.yaml resources[dex-client-muster-token-exchange-<name>-secret.yaml]
    reason: "Added: the secrets kustomization lists the Secret of the hub's token-exchange client muster-token-exchange-<name>, so it is applied with the rest · M32"
  - key: extras:agent-platform/secrets/<name>-token-exchange-credentials.yaml
    reason: "Added: on a hub, the credentials for exchanging tokens into <name> are a Secret under extras/agent-platform/secrets instead of inline values · M32"
  - key: extras:agent-platform/secrets/kustomization.yaml resources[<name>-token-exchange-credentials.yaml]
    reason: "Added: the secrets kustomization lists the token-exchange credentials Secret for <name>, so it is applied with the rest · M32"
  - key: extras:agent-platform/secrets/muster-broker-clients.yaml
    reason: "Added: on a hub, muster's broker client credentials are the Secret muster-broker-clients under extras/agent-platform/secrets instead of inline values · M32"
  - key: extras:agent-platform/secrets/kustomization.yaml resources[muster-broker-clients.yaml]
    reason: "Added: the secrets kustomization lists the muster-broker-clients Secret, so it is applied with the rest · M32"
  - key: configmap:muster.muster.oauth.server.tokenExchangeBroker.brokerClients.<name>.clientCredentialsSecretRef
    reason: "Added: the broker client <name> in muster's token-exchange block points at its credentials Secret (clientCredentialsSecretRef) instead of carrying an inline secret · M32"
  - key: configmap:muster.muster.oauth.server.tokenExchangeBroker.targets.<name>.clientCredentialsSecretRef
    reason: "Added: the token-exchange target <name> in muster points at its credentials Secret (clientCredentialsSecretRef) instead of carrying an inline secret · M32"

  # --- M5 — kagent's UI gets its own Dex client and audience ---
  - key: dex-configmap:oidc.extraStaticClients[kagent]
    reason: "Added: Dex gets a client named kagent for the kagent UI, which signed in through another client's id until now · M5"
  - key: extras:agent-platform/secrets/dex-client-kagent-secret.yaml
    reason: "Added: the kagent Dex client's secret is the Secret dex-client-kagent-secret under extras/agent-platform/secrets · M5"
  - key: extras:agent-platform/secrets/kustomization.yaml resources[dex-client-kagent-secret.yaml]
    reason: "Added: the secrets kustomization lists dex-client-kagent-secret.yaml, so the kagent client's Secret is applied with the rest · M5"
  - key: configmap:muster.muster.oauth.server.trustedAudiences[kagent]
    reason: "Added: muster trusts tokens issued for the kagent client (audience kagent), so the kagent UI's calls into muster are accepted · M5"
  - key: configmap:kagent.oauth2-proxy.extraArgs.oidc-extra-audience[kagent]
    reason: "Added: the kagent UI's oauth2-proxy accepts tokens with the audience kagent, its own client · M5"
  - key: configmap:kagent.oauth2-proxy.extraArgs.oidc-extra-audience
    reason: "Added: the kagent UI's oauth2-proxy gets an oidc-extra-audience list with the audiences it accepts besides its own client · M5"

  # --- M5 — muster and the kagent UI trust the authenticator's audience ---
  - key: configmap:muster.muster.oauth.server.trustedAudiences[dex-k8s-authenticator]
    reason: "Added: muster trusts tokens issued for the dex-k8s-authenticator client, so a kubectl login token is accepted for muster's tools · M5"
  - key: configmap:kagent.oauth2-proxy.extraArgs.oidc-extra-audience[dex-k8s-authenticator]
    reason: "Added: the kagent UI's oauth2-proxy accepts tokens issued for the dex-k8s-authenticator client · M5"

  # --- M30 — the portals' Dex client is named backstage ---
  - key: dex-configmap:oidc.extraStaticClients[backstage]
    reason: "Added: Dex gets a client named backstage for the Dev Portal and every customer portal, which signed in through an installation-specific client id until now · M30"
  - key: dex-configmap:oidc.staticClients.dexK8SAuthenticator.trustedPeers[backstage]
    reason: "Added: the dex-k8s-authenticator client trusts the backstage client as a peer, so a portal session can obtain a kubectl token · M30"
  - key: configmap:muster.muster.oauth.server.trustedAudiences[backstage]
    reason: "Added: muster trusts tokens issued for the backstage client, so the portal's calls into muster are accepted · M30"
  - key: configmap:kagent.oauth2-proxy.extraArgs.oidc-extra-audience[backstage]
    reason: "Added: the kagent UI's oauth2-proxy accepts tokens issued for the backstage client, so a portal session opens the kagent UI · M30"

  # --- M1 — a Dex client's secret becomes a referenced Secret (dex-app 3.2.2 or later) ---
  - key: dex-configmap:oidc.staticClients.<name>.clientSecretRef
    reason: "Added: the Dex client <name> reads its secret from a Secret in the cluster instead of the encrypted values patch. Needs dex-app 3.2.2 · M1"
  - key: dex-configmap:oidc.extraStaticClients[*].secretRef
    reason: "Added: the extra Dex client reads its secret from a Secret in the cluster (secretRef) instead of the encrypted values patch. Needs dex-app 3.2.2 · M1"
  - key: extras:agent-platform/secrets/dex-client-<name>-secret.yaml
    reason: "Added: the <name> Dex client's secret is its own Secret under extras/agent-platform/secrets, shared with the client that presents it. Needs dex-app 3.2.2 · M1"
  - key: extras:agent-platform/secrets/kustomization.yaml resources[dex-client-<name>-secret.yaml]
    reason: "Added: the secrets kustomization lists the <name> Dex client's Secret, so it is applied with the rest. Needs dex-app 3.2.2 · M1"
  - key: extras:mcp-<name>/dex-client-mcp-<name>-secret.yaml
    reason: "Added: the mcp-<name> server's Dex client secret is a Secret in the server's own extras directory, the Dex-side copy of what the server presents. Needs dex-app 3.2.2 · M1"
  - key: extras:mcp-<name>/kustomization.yaml resources[dex-client-mcp-<name>-secret.yaml]
    reason: "Added: the mcp-<name> server's kustomization lists its Dex client Secret, so it is applied with the server. Needs dex-app 3.2.2 · M1"

  # --- M9 — the mcp-* servers' Valkey password becomes a generated Secret ---
  - key: extras:mcp-<name>/valkey-credentials.enc.yaml
    reason: "Added: the mcp-<name> server's Valkey reads its password from a generated Secret (valkey-credentials) in the server's extras directory · M9"
  - key: extras:mcp-<name>/kustomization.yaml resources[valkey-credentials.enc.yaml]
    reason: "Added: the mcp-<name> server's kustomization lists valkey-credentials.enc.yaml, so the Valkey Secret is applied with the server · M9"
  - key: extras:mcp-<name>/oauth-credentials.enc.yaml stringData.VALKEY_PASSWORD
    reason: "Added: the mcp-<name> server gets the same generated Valkey password in its credentials (VALKEY_PASSWORD), so the server and its Valkey agree · M9"
  - key: extras:mcp-<name>/oauth-credentials.enc.yaml type
    reason: "Added: the mcp-<name> server's credentials Secret states its type (Opaque), written together with the Valkey password · M9"

  # --- M11 — the edge validates the portals' tokens on the 4 line ---
  - key: configmap:agent-platform-mcps.agentgateway.jwt.extraProviders
    reason: "Added: on chart 4.x the agentgateway edge validates the portals' Dex ID tokens itself, so it gets this installation's Dex as an extra JWT provider · M11"
  - key: configmap:gateway.jwksEgress.enabled
    reason: "Added: on chart 4.x the agentgateway edge fetches Dex's JWKS to validate tokens, which needs egress to Dex switched on · M11"
  - key: configmap:extraObjects[ReferenceGrant/<namespace>/agentgateway-jwks-dex]
    reason: "Added: a ReferenceGrant agentgateway-jwks-dex in <namespace> lets the edge's JWKS fetch reach Dex across namespaces · M11"

  # --- M18 — the portal's AI chat moves into the platform's Component (before M3: the Component's directory covers these too) ---
  - key: backstage:agent-platform/app-config:aiChat
    reason: "Added: the AI chat — its Anthropic key from the portal's environment, its model and its two MCP servers (the portal's own actions server, this installation's muster) — moves from the main app-config into the Agent Platform Component's app-config fragment · M18"
  - key: backstage:agent-platform/app-config:mcpActions
    reason: "Added: the chat's tool naming (mcpActions.namespacedToolNames) moves from the main app-config into the Agent Platform Component's app-config fragment · M18"
  - key: backstage:agent-platform/app-config:backend.actions
    reason: "Added: the actions the portal lists for the chat's MCP actions server (backend.actions, the plugin sources and the filter) move from the main app-config into the Agent Platform Component's app-config fragment · M18"
  - key: backstage:agent-platform/values:google
    reason: "Added: a chat on Vertex AI names its Google project and region in the Agent Platform Component's values, which the chart exports to the portal, instead of the portal's own user values · M18"
  - key: backstage:file:agent-platform/ai-chat-credentials.enc.yaml
    reason: "Added: the chat's credential — its Anthropic API key, or on Vertex AI its Google service account's JSON — is the SOPS-encrypted Secret agent-platform-ai-chat-credentials-backstage of the Agent Platform Component, supplied at commit and read by the portal's HelmRelease as the chart value the chart exposes as ANTHROPIC_API_KEY or mounts as the credentials file, once the portal's own configuration no longer carries the chat by hand · M18"
  - key: backstage:agent-platform/kustomization:resources[ai-chat-credentials.enc.yaml]
    reason: "Added: the Agent Platform Component lists the Secret agent-platform-ai-chat-credentials-backstage, so it is applied with the portal · M18"

  # --- M3 — the portal's platform section moves to its own Component ---
  - key: backstage:file:agent-platform
    reason: "Moved: the portal's Agent Platform settings leave the main app-config for a kustomize Component the platform owns · M3"

  # --- M31 — the post-login allowlist names the portals and the connectors' completion ---
  - key: configmap:muster.muster.oauth.mcpClient.postLoginRedirectAllowlist
    reason: "Added: muster's post-login redirect allowlist names the portals and the connectors' completion page, so a sign-in started there returns there · M31"

  # --- M6 — the global domain is written explicitly ---
  - key: configmap:global.domain
    reason: "Added: global.domain is written explicitly with this installation's base domain, which the charts read instead of deriving it · M6"

  # --- M7 — the shared defaults and the fleet policy's components written explicitly ---
  - key: configmap:components.kagent.enabled
    reason: "Added: components.kagent.enabled is written explicitly with the value this installation's organisation gets, instead of being left to the shared defaults · M7"
  - key: configmap:components.agent-manager.enabled
    reason: "Added: components.agent-manager.enabled is written explicitly with the value this installation's organisation gets, instead of being left to the shared defaults · M7"
  - key: configmap:components.cluster-manager.enabled
    reason: "Added: components.cluster-manager.enabled is written explicitly with the value this installation's organisation gets, instead of being left to the shared defaults · M7"
  - key: configmap:components.klaus-gateway.enabled
    reason: "Added: components.klaus-gateway.enabled is written explicitly: on where this installation has a Slack app, off elsewhere · M7"
  - key: configmap:postgres.enabled
    reason: "Added: postgres.enabled is written explicitly (on where kagent runs) instead of being left to the shared defaults · M7"
  - key: configmap:cluster-manager
    reason: "Added: the cluster-manager block is written explicitly for an installation that runs the cluster-manager · M7"
  - key: configmap:clusterManager
    reason: "Added: the clusterManager block (the chart's camel-case key) is written explicitly for an installation that runs the cluster-manager · M7"
  - key: configmap:klausGateway.reviews
    reason: "Added: the Klaus gateway's team reviews are written explicitly: switched on, their audience, and the platform workloads allowed to call them · M7"
  - key: configmap:klausGateway.obo.connectors.enabled
    reason: "Added: the Klaus gateway's on-behalf-of connectors are written explicitly as switched on for every installation running the gateway · M7"
  - key: configmap:klausGateway.a2a.enabled
    reason: "Added: the Klaus gateway's agent-to-agent calls are written explicitly as switched on, with the installation's default agent · M7"
