# Keys the definition renders that an installation enabled before a migration lacks. Their absence from the
# record is the migration's planned addition, not drift: the comparison marks a leaf the definition renders
# and the record does not have, under one of these keys, planned with the reason. A leaf the record holds
# with another value stays a difference. Key paths use the file prefixes and the normalisation of
# removals.yaml ([*] for a list index, <name> for a map key or a part of a file or entry name). The
# comparison takes the first key that names a path: a more specific key precedes one that covers it.
#
# The M numbers are the wave-1 migration list's (M1–M11) and continue removals.yaml's (M30…).
migrations:
  # --- M32 — a spoke's token-exchange client secret is referenced; the hub's federation files ---
  - key: extras:agent-platform/secrets/dex-client-<name>-token-exchange-secret.yaml
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
  - key: extras:agent-platform/secrets/kustomization.yaml resources[dex-client-<name>-token-exchange-secret.yaml]
    reason: M32 — a spoke's token-exchange client secret is a referenced Secret; the hub's federation credentials are files
