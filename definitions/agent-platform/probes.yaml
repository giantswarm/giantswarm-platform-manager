# The anonymous HTTP probes of the agent-platform definition: requests that carry no identity and
# run direct from the manager against the installation's public endpoints. Each probe is a dimension
# of the feature it names (kind probe) in the verify's result; the live dimensions of features.yaml
# (kind live) are the reads that need the person's authority on the installation.
# url is a Go template over {{.BaseDomain}} (the installation's), and for perDexClient probes
# {{.ClientID}} and {{.RedirectURI}} (query-escaped) of every client the rendered dex patch declares.
# dexConnectorStep takes an authorization request one step further: Dex's /auth only picks the
# connector and answers the same for any client (its picker page, or a redirect to the one connector),
# so the probe requests the /auth/<connector> that answer names and holds the connector's answer to
# expect; the connector answers an unknown client 404 and an unregistered redirect URI 400.
# expect lists the HTTP status codes that mean "as defined"; any other answer is drift, no answer
# (a target unreachable from the manager) is not checked.
probes:
  - id: dex-auth-request
    feature: identity
    key: Dex knows every client the definition declares and its redirect URI (its connector answers the auth request with a redirect or its login form)
    url: https://dex.{{.BaseDomain}}/auth?client_id={{.ClientID}}&redirect_uri={{.RedirectURI}}&response_type=code&scope=openid
    perDexClient: true
    dexConnectorStep: true
    expect: [200, 302]
  - id: oauth2-proxy-gate
    feature: identity
    key: the kagent UI behind oauth2-proxy refuses an anonymous request (302 to the login or 403)
    url: https://kagent.{{.BaseDomain}}/
    expect: [302, 403]
  - id: muster-protected-resource-metadata
    feature: tool-access
    key: muster publishes its OAuth protected-resource metadata (200)
    url: https://muster.{{.BaseDomain}}/.well-known/oauth-protected-resource
    expect: [200]
