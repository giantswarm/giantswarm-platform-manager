# The consistency features of the agent-platform definition and the dimensions each one rolls up.
# A feature shows one mark (as defined, differs by input, drifted) and expands to its dimensions on demand.
# Every dimension appears under exactly one feature. `kind` says where the dimension is observed:
# configmap, dex-configmap, extras and backstage are files of the fileset (compared against the render);
# live is a probe against the running installation, which the definition renders as data (Result.Probes)
# and the verify slice executes.
#
# A file dimension's key names the leaves it observes, and the comparison routes every difference by it.
# A word with a slash or a file suffix names a file or directory — by its path under extras/ (under
# extras/backstage/ for the backstage kind, under apps/ for a patch), or by its name at any depth; `<x>`
# stands for a part of a name; a directory covers everything beneath it. Every other word is a YAML path
# inside the file (inside the YAML text a ConfigMap or Secret holds) and covers everything beneath it:
# `[*]` is any list entry, `[x]` the entry with identity x, `<x>` any map key or part of one. ` / `
# separates alternatives; an alternative without a file word is observed in the files of the alternative
# before it. A remark in parentheses is not read. A leaf goes to the dimension of its file's kind that
# names it most specifically (the longer words win, then file order), else to the kind's dimension marked
# `catchAll: true` (whose key is prose), else it is reported under the result's feature "other". A live
# dimension's key is prose.
features:
  identity:
    title: Identity
    description: Dex clients and the audiences and issuers muster, the kagent UI and the edge trust.
    dimensions:
      - {id: oauth2-proxy-extra-audience, kind: configmap, key: kagent.oauth2-proxy.extraArgs.oidc-extra-audience}
      - {id: muster-dex-connector-id, kind: configmap, key: muster.muster.oauth.server.dex.connectorId}
      - {id: muster-dex-client-id, kind: configmap, key: muster.muster.oauth.server.dex.clientId}
      - {id: muster-dex-allow-private-ip-oidc, kind: configmap, key: muster.muster.oauth.server.dex.allowPrivateIPOIDC}
      - {id: muster-trusted-audiences, kind: configmap, key: muster.muster.oauth.server.trustedAudiences}
      - {id: muster-trusted-issuers, kind: configmap, key: muster.muster.oauth.server.trustedIssuers}
      - {id: muster-public-registration-redirect-uris, kind: configmap, key: muster.muster.oauth.server.trustedPublicRegistrationRedirectURIs}
      - {id: muster-post-login-redirect-allowlist, kind: configmap, key: muster.muster.oauth.mcpClient.postLoginRedirectAllowlist}
      - {id: edge-jwt-validation, kind: configmap, key: "gateway.jwksEgress / extraObjects[ReferenceGrant/<namespace>/<name>] / agent-platform-mcps.agentgateway.jwt.extraProviders"}
      - {id: edge-oauth-mode, kind: configmap, key: agent-platform-mcps.agentgateway.oauthMode}
      - {id: dex-extra-static-clients, kind: dex-configmap, key: oidc.extraStaticClients}
      - {id: dex-static-client-keys, kind: dex-configmap, key: oidc.staticClients}
      - {id: dex-other-oidc-keys, kind: dex-configmap, catchAll: true, key: every other key of the patch (oidc.* but staticClients and extraStaticClients)}
      - {id: live-oauth2-proxy-extra-audience, kind: live, key: oauth2-proxy --oidc-extra-audience argument}
      - {id: live-muster-trusted-audiences, kind: live, key: muster ConfigMap trustedAudiences}
      - {id: live-muster-connector-and-client-id, kind: live, key: "muster ConfigMap dex connectorId, where the definition renders one"}
      - {id: live-kagent-api-protected, kind: live, key: /api/agents answered 403 by oauth2-proxy}
      - {id: live-kagent-login-redirect, kind: live, key: /oauth2/start 302 to Dex with client_id=kagent}
      - {id: live-dex-auth-per-client, kind: live, key: Dex /auth 302 for every rendered client}
      - {id: live-oauth2-proxy-audience, kind: live, key: no audience mismatch in oauth2-proxy's log}
  secrets:
    title: Secrets
    description: Every referenced Secret present and shaped as the platform reads it; nothing inline.
    dimensions:
      - {id: oauth2-proxy-existing-secret, kind: configmap, key: kagent.oauth2-proxy.config.existingSecret}
      - {id: oauth2-proxy-inline-credentials, kind: configmap, key: kagent.oauth2-proxy.config.clientID / kagent.oauth2-proxy.config.clientSecret / kagent.oauth2-proxy.config.cookieSecret (never inline)}
      - {id: muster-and-valkey-existing-secrets, kind: configmap, key: muster.muster.oauth.server.existingSecret / muster.muster.oauth.server.storage.valkey.existingSecret / valkey}
      - {id: forbid-inline-secrets, kind: configmap, key: gitops.forbidInlineSecrets}
      - {id: secret-values-patch-keys, kind: configmap, key: agent-platform/secret-values.yaml.patch}
      - {id: secrets-kustomization-list, kind: extras, key: agent-platform/secrets/kustomization.yaml}
      - {id: oauth2-proxy-credentials-secret, kind: extras, key: agent-platform/secrets/kagent-oauth2-proxy-credentials.yaml}
      - {id: other-secret-shapes, kind: extras, key: "agent-platform/secrets/ (every other Secret: name, namespace, labels, keys)"}
      - {id: live-oauth2-proxy-secret-and-flux-sa, kind: live, key: Secret kagent-oauth2-proxy-credentials and ServiceAccount kagent-flux}
  runtime:
    title: Runtime
    description: kagent, the platform Postgres, connectivity and the chart release.
    dimensions:
      - {id: kagent-enabled, kind: configmap, key: components.kagent.enabled}
      - {id: klaus-gateway, kind: configmap, key: components.klaus-gateway.enabled / klausGateway}
      - {id: postgres-enabled, kind: configmap, key: postgres.enabled}
      - {id: postgres-backup, kind: configmap, key: postgres.backup}
      - {id: postgres-storage-class, kind: configmap, key: postgres.storage.storageClass}
      - {id: kagent-providers, kind: configmap, key: kagent.providers}
      - {id: kagent-model-configs, kind: configmap, key: kagent.modelConfigs}
      - {id: patch-top-level-keys, kind: configmap, catchAll: true, key: the patch's top-level keys (every key no other dimension names)}
      - {id: chart-line-on-record, kind: record, key: config.yaml.patch agentPlatform.kagentApiV2 (the meta chart line the record selects and a fresh enable writes)}
      - {id: extras-kustomization-resources, kind: extras, key: agent-platform/kustomization.yaml (resources and the chart line's patch)}
      - {id: live-model-configs, kind: live, key: ModelConfigs in the kagent namespace}
      - {id: live-kagent-provider-values, kind: live, key: kagent HelmRelease .spec.values.providers}
      - {id: live-helmreleases-ready, kind: live, key: "HelmReleases agent-platform, kagent, connectivity, muster, mcps Ready"}
      - {id: live-kagent-workloads, kind: live, key: kagent pods Running and the CNPG cluster healthy}
      - {id: live-pod-certificate-request, kind: live, key: "certificates.k8s.io/v1beta1 podcertificaterequests served by the apiserver (Agent Substrate's feature gates, the 4 line)"}
      - {id: live-drift, kind: live, key: live values equal the rendered manifests}
  tool-access:
    title: Tool access
    description: muster and the MCP servers of the installation itself, and the agent-manager.
    dimensions:
      - {id: agent-manager, kind: configmap, key: components.agent-manager.enabled / agent-manager.oauth}
      - {id: own-mcp-servers, kind: configmap, key: "agent-platform-mcps.mcpServers[http://<name>.svc:8080/mcp] / agent-platform-mcps.mcpServers[<scheme>://mcp-<name>.<domain>/mcp] (the installation's own: at the in-cluster Service, or on its own base domain)"}
      - {id: own-mcp-kubernetes-url, kind: configmap, key: "agent-platform-mcps.mcpServers[http://mcp-kubernetes.mcp-kubernetes.svc:8080/mcp].url"}
      - {id: muster-private-exchange, kind: configmap, key: muster.muster.oauth.mcpClient.tokenExchange.allowPrivateIP}
      - {id: own-mcp-private-urls, kind: extras, key: mcp-<name>/user-values.yaml / mcp-<name>/kustomization.yaml configMapGenerator / generatorOptions / patches (the ConfigMap the HelmRelease reads it from)}
      - {id: own-mcp-directories, kind: extras, key: "mcp-<name>/ (each server's kustomization, Dex client and credential Secrets)"}
      - {id: live-own-mcp-servers, kind: live, key: MCPServer objects of the installation itself}
      - {id: live-registered-mcp-servers, kind: live, key: "MCPServer objects registered under extras/agent-platform/mcpservers, present and none Failed"}
      - {id: live-muster-protected-resource, kind: live, key: muster's OAuth protected-resource metadata}
  federation:
    title: Federation and tunnels
    description: The hub's token exchange into other installations, their MCP servers, and the tunnel to private ones.
    dimensions:
      - {id: token-exchange-broker, kind: configmap, key: muster.muster.oauth.server.tokenExchangeBroker}
      - {id: extra-ca-file, kind: configmap, key: muster.muster.extraCaFile}
      - {id: identity-providers, kind: configmap, key: agent-platform-mcps.identityProviders}
      - {id: federated-mcp-servers, kind: configmap, key: "agent-platform-mcps.mcpServers[https://<host>] (other installations', through the tunnel or on their domain)"}
      - {id: tunnel-files, kind: extras, key: agent-platform/tunnelport/ / kubernetes/envs/prod/values.yaml tunnelport (the tunnel's objects and the fleet's tunnelport values)}
      - {id: portal-cluster-token-broker, kind: backstage, key: agent-platform/app-config.yaml gs.clusterTokenBroker}
  portal:
    title: Portal section
    description: What the platform writes into the developer portal's configuration.
    dimensions:
      - {id: portal-component-files, kind: backstage, key: "agent-platform/ (the Component's kustomization, and its ConfigMaps' apiVersion, kind and metadata)"}
      - {id: portal-extensions, kind: backstage, key: agent-platform/app-config.yaml app.extensions}
      - {id: portal-base-url, kind: backstage, key: agent-platform/app-config.yaml app.baseUrl}
      - {id: portal-muster-installations, kind: backstage, key: agent-platform/app-config.yaml muster.installations}
      - {id: portal-flux-service-account, kind: backstage, key: agent-platform/app-config.yaml agentPlatform.fluxServiceAccountName (a portal before backstage 1.1.0)}
      - {id: portal-skills-repositories, kind: backstage, key: agent-platform/app-config.yaml agentPlatform.skills.repositories}
      - {id: portal-kagent-installations, kind: backstage, key: agent-platform/app-config.yaml agentPlatform.kagent.installations}
      - {id: portal-ai-chat, kind: backstage, key: "agent-platform/app-config.yaml aiChat / mcpActions / backend.actions / agent-platform/values.yaml google / agent-platform/ai-chat-credentials.enc.yaml (the chat, its actions server, a Vertex chat's project and region, and the Secret with its credential)"}
      - {id: portal-edge-jwt-provider, kind: configmap, key: "gateway.jwksEgress / extraObjects[ReferenceGrant/<namespace>/<name>] / agent-platform-mcps.agentgateway.jwt.extraProviders (the chat's ID token at the edge on the 4 line; edge-jwt-validation names the same leaves first)"}
      - {id: portal-catalog, kind: backstage, key: agent-platform/app-config.yaml catalog}
      - {id: portal-auth-extra-scopes, kind: backstage, key: agent-platform/app-config.yaml gs.auth.extraScopes}
      - {id: portal-auth-provider, kind: backstage, key: agent-platform/app-config.yaml gs.authProvider / auth.providers}
      - {id: portal-database-client, kind: backstage, key: agent-platform/app-config.yaml backend.database.client}
      - {id: portal-extra-app-config, kind: backstage, key: agent-platform/values.yaml backstage.extraAppConfig (the Component's app-config file)}
      - {id: portal-helmrelease-values-from, kind: backstage, key: agent-platform/kustomization.yaml patches (the HelmRelease valuesFrom patch)}
