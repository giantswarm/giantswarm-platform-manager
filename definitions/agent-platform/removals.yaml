# Keys found in an enabled installation's agent-platform fileset that no input of schema.json renders.
# Each is dropped from the fileset by the renderer, for the reason given. Key paths use the file prefixes and
# the normalisation of schema.json's x-renders ([*] for a list index, <name> for a per-installation map key).
#
# kinds:
#   template            the shared-configs template renders the key (or its intended value) from the installation
#                       facts; the hand-written copy is redundant or contradicts it
#   referenced-secret   a credential the dex-app prerequisite turns into a referenced Secret; never written into
#                       a patch again
#   not-platform        the installation carries it in one of the platform's files, but it configures something
#                       the platform does not read: the installation's login connectors, Dex's ingress, agents
#                       and MCP servers registered on the platform (out of the definition's scope)
#   other-definition    a developer-portal key that belongs to the customer-portal definition, which owns the
#                       portal; this definition writes only the portal's agent-platform section
#   migration           a value the fleet carries today that is no input of the definition: it moves to where
#                       it belongs (the template, the policy, a workload manifest) or goes; the reason names
#                       the migration (M12…) the empty-diff driver classifies it under
removals:
  # --- former inputs: migrations (giantswarm#37837) ---
  - key: configmap:components.agent-sandbox
    kind: migration
    reason: M13 — the agent sandbox is no component of the definition; the one installation running it stops
  - key: configmap:kagent.providers.anthropic.model
    kind: migration
    reason: M26 — the default model is the template's; an installation's override moves there or goes
  - key: configmap:kagent.modelConfigs
    kind: migration
    reason: M25 — ModelConfigs are workloads registered on the platform, a manifest beside the agents
  - key: configmap:kagent.controller.resources
    kind: migration
    reason: M23 — resource tuning is the chart's or the template's
  - key: configmap:muster.resources
    kind: migration
    reason: M23 — resource tuning is the chart's or the template's
  - key: configmap:kagent.kagent-tools
    kind: migration
    reason: M24 — the chart's bundled sample agents are workloads
  - key: configmap:kagent.cilium-policy-agent
    kind: migration
    reason: M24 — the chart's bundled sample agents are workloads
  - key: configmap:kagent.promql-agent
    kind: migration
    reason: M24 — the chart's bundled sample agents are workloads
  - key: configmap:kagent.oauth2ProxyIngress
    kind: migration
    reason: M22 — a private installation's peer rule belongs to the template
  - key: configmap:postgres.storage
    kind: migration
    reason: M17 — the platform Postgres block is the template's, by provider
  - key: configmap:postgres.backup
    kind: migration
    reason: M17 — the platform Postgres block is the template's, from the record's subscription
  - key: configmap:muster.muster.oauth.server.dex.connectorId
    kind: migration
    reason: M27 — the login connector pin is the template's; one installation's own pin goes there or goes
  - key: configmap:muster.muster.oauth.server.trustedIssuers
    kind: migration
    reason: M15 — the template renders muster's trusted issuers (the installation's Dex, the cluster's service-account issuer) from the record
  - key: configmap:muster.muster.oauth.server.trustedPublicRegistrationRedirectURIs
    kind: migration
    reason: M20 — a customer's consumers register with muster, not in the patch; where the registration lands is giantswarm/giantswarm#37876
  - key: configmap:muster.muster.oauth.mcpClient.tokenExchange
    kind: migration
    reason: M16 — an identity-provider-only federation is no shape of the definition; the hub's targets come from its portal
  - key: configmap:agent-platform-mcps.mcpServers
    kind: migration
    reason: M19 — servers registered with muster beyond the installation's own three are platform objects, not the patch; where they land is giantswarm/giantswarm#37876
  - key: configmap:klausGateway.slack.channelAllowlist
    kind: migration
    reason: M28 — the gateway's Slack shape is the policy's; a channel allowlist is never a definition's value
  - key: configmap:klausGateway.a2a.saToken
    kind: migration
    reason: M29 — the gateway's A2A shape is the policy's
  - key: backstage:app-config:aiChat
    kind: other-definition
    reason: M18 — the portal's chat is the customer-portal definition's
  - key: backstage:app-config:mcpActions
    kind: other-definition
    reason: M18 — the portal's chat is the customer-portal definition's
  - key: backstage:app-config:agentPlatform.skills
    kind: other-definition
    reason: the portal's skill repositories are the customer-portal definition's


  # --- agent-platform configmap-values.yaml.patch ---
  - key: configmap:gitops.forbidInlineSecrets
    kind: template
    reason: the template sets it for every installation
  - key: configmap:muster.muster.oauth.server.dex.clientId
    kind: template
    reason: rendered from services.muster.clientId in config.yaml.patch; an installation with its own client id declares it there
  - key: configmap:muster.muster.oauth.server.dex.allowPrivateIPOIDC
    kind: template
    reason: rendered from managementCluster.private in config.yaml.patch; a private installation declares it there
  - key: configmap:components.agent-platform-mcps.enabled
    kind: template
    reason: the template enables the component for every installation
  - key: configmap:agent-platform-mcps.agentgateway.oauthMode
    kind: template
    reason: equals the template's value; the edge cannot validate muster's opaque tokens, so no other value exists
  - key: configmap:agent-platform-mcps.identityProviders
    kind: template
    reason: an empty map repeats the template; a hub's federation targets render the real entries
  - key: configmap:agent-manager.oauth
    kind: template
    reason: on the 4 chart line the chart derives the manager's OAuth (issuer, client, Secret, base URL) from the template's global.identity and global.domain; the definition writes the block on the 3 line only, where the template has no identity block
  - key: configmap:cluster-manager.oauth
    kind: template
    reason: on the 4 chart line the chart derives the manager's OAuth from the template's global.identity and global.domain; the definition writes the block on the 3 line only

  # --- dex-app secret-values.yaml.patch ---
  - key: dex-secret:oidc.staticClients.muster.clientID
    kind: template
    reason: rendered from services.muster.clientId in config.yaml.patch
  - key: dex-secret:oidc.staticClients.muster.clientSecret
    kind: referenced-secret
    reason: the platform client's secret becomes a referenced Secret
  - key: dex-secret:oidc.staticClients.dexK8SAuthenticator.clientSecret
    kind: referenced-secret
    reason: the authenticator client's secret becomes a referenced Secret
  - key: dex-secret:oidc.staticClients.mcpKubernetes.clientSecret
    kind: referenced-secret
    reason: the MCP server client's secret becomes a referenced Secret
  - key: dex-secret:oidc.staticClients.mcpPrometheus.clientSecret
    kind: referenced-secret
    reason: the MCP server client's secret becomes a referenced Secret
  - key: dex-secret:oidc.staticClients.mcpCapi.clientSecret
    kind: referenced-secret
    reason: the MCP server client's secret becomes a referenced Secret
  - key: dex-secret:oidc.muster.clientSecret
    kind: referenced-secret
    reason: a misplaced copy of the platform client's secret (the chart reads oidc.staticClients.muster); becomes a referenced Secret
  - key: dex-secret:oidc.customer
    kind: not-platform
    reason: the installation's login connectors; owned by the installation's Dex, not read by the platform

  # --- dex-app configmap-values.yaml.patch ---
  - key: dex-configmap:oidc.customer
    kind: not-platform
    reason: the installation's login connectors; owned by the installation's Dex, not read by the platform — the plan keeps them on the patch as another owner's key
  - key: dex-configmap:ingress
    kind: not-platform
    reason: Dex's own ingress tuning — the plan keeps it on the patch as another owner's key

  # --- management-clusters extras/agent-platform/ ---
  - key: extras:agents
    kind: not-platform
    reason: agents deployed on the platform are workloads, out of the definition's scope
  - key: extras:mcpservers
    kind: not-platform
    reason: MCP servers registered on the platform are workloads, out of the definition's scope

