# Keys found in an enabled installation's agent-platform fileset that no input of schema.json renders.
# Each is dropped from the fileset by the renderer, for the reason given. Key paths use the file prefixes and
# the normalisation of schema.json's x-renders ([*] for a list index, <name> for a per-installation map key,
# and within a list entry's identity <x> for any part of it). The comparison takes the first key that names
# a path: a more specific key precedes one that covers it. A reason may reference a placeholder its key
# declares: the comparison fills it with the part of the path that matched, so the reason names the concrete
# server or entry. <domain> is no wildcard: it stands for the installation's own base domain, so a key with it
# names the installation's own form of an entry and nothing else.
#
# The reason is what the Dev Portal shows a platform engineer next to the planned change, so it is one
# sentence in their words: what is on the installation today, what replaces it and why. It starts with
# Removed:, Moved:, Changed: or Kept: (a key another owner carries, which stays as it is), names the chart
# line, the value or the object, and never the file (the file is the group the change is listed under).
# A removal that belongs to a migration carries the migration as a trailing tag (· M<n>).
#
# kinds:
#   template            the shared defaults render the key (or its intended value) from the installation's
#                       facts; the hand-written copy is redundant or contradicts it
#   referenced-secret   a credential the dex-app prerequisite turns into a referenced Secret; never written into
#                       a patch again
#   not-platform        the installation carries it in one of the platform's files, but it configures something
#                       the platform does not read: the installation's login connectors, Dex's ingress, agents
#                       and MCP servers registered on the platform; it stays where it is
#   other-definition    a developer-portal key that belongs to the customer-portal definition, which owns the
#                       portal; this definition writes only the portal's agent-platform section
#   migration           a value the fleet carries today that is no input of the definition: it moves to where
#                       it belongs (the shared defaults, the fleet policy, a workload manifest) or goes
removals:
  # --- former inputs: migrations ---
  - key: configmap:components.agent-sandbox
    kind: migration
    reason: "Removed: components.agent-sandbox switches the agent sandbox on here; the sandbox is retired from the fleet, nothing replaces it, and it stops on the one installation running it · M13"
  - key: configmap:kagent.providers.anthropic.model
    kind: migration
    reason: >-
      Removed: kagent.providers.anthropic.model pins the default Anthropic model on this installation; the shared defaults carry the fleet-wide default, and
      an installation-specific pick moves there or is dropped · M26
  - key: configmap:kagent.modelConfigs
    kind: migration
    reason: "Removed: kagent's ModelConfigs are inlined in these values; each becomes a ModelConfig object under extras, next to the agents that use it · M25"
  - key: configmap:kagent.controller.resources
    kind: migration
    reason: "Removed: the kagent controller's CPU and memory requests are tuned here; the chart's defaults, or the shared defaults, size the controller the same way on every installation · M23"
  - key: configmap:muster.resources
    kind: migration
    reason: "Removed: muster's CPU and memory requests are tuned here; the chart's defaults, or the shared defaults, size muster the same way on every installation · M23"
  - key: configmap:kagent.kagent-tools
    kind: migration
    reason: "Removed: the chart's bundled kagent-tools sample agent is switched on here; a sample agent an installation wants is an Agent object under extras · M24"
  - key: configmap:kagent.cilium-policy-agent
    kind: migration
    reason: "Removed: the chart's bundled cilium-policy-agent sample is switched on here; a sample agent an installation wants is an Agent object under extras · M24"
  - key: configmap:kagent.promql-agent
    kind: migration
    reason: "Removed: the chart's bundled promql-agent sample is switched on here; a sample agent an installation wants is an Agent object under extras · M24"
  - key: configmap:kagent.oauth2ProxyIngress
    kind: migration
    reason: "Removed: the kagent UI's oauth2-proxy ingress is written per installation here; the shared defaults carry the same ingress rule for every private installation · M22"
  - key: configmap:postgres.storage
    kind: migration
    reason: "Removed: the platform Postgres storage class is written here; the shared defaults set it per cloud provider · M17"
  - key: configmap:postgres.backup
    kind: migration
    reason: "Removed: the platform Postgres backup settings are written here; the shared defaults derive them from the installation's subscription · M17"
  - key: configmap:muster.muster.oauth.server.dex.connectorId
    kind: migration
    reason: "Removed: muster's Dex login connector is pinned here; the shared defaults pick the connector for every installation, and an installation-specific pin moves there or is dropped · M27"
  - key: configmap:muster.muster.oauth.server.trustedIssuers
    kind: migration
    reason: >-
      Removed: muster's trusted issuers are listed by hand here; the shared defaults derive them (this installation's Dex and the cluster's service-account
      issuer) from the installation's base domain · M15
  - key: configmap:muster.muster.oauth.server.trustedPublicRegistrationRedirectURIs
    kind: migration
    reason: >-
      Removed: the redirect URIs of a customer's own OAuth clients are allowlisted here; those clients register with muster instead, and where that
      registration lands is giantswarm/giantswarm#37876 · M20
  - key: configmap:muster.muster.oauth.mcpClient.tokenExchange
    kind: migration
    reason: >-
      Removed: muster's token exchange is set up here as a bare identity-provider federation; a hub's exchange targets are derived from the installations
      its portal shows, and an identity-provider-only form no longer exists · M16
  # The installation's own three servers by identity, the entry's url — the server's in-cluster Service as the
  # shared defaults register it, or the server on the installation's own base domain (<domain>: the fact, never a
  # wildcard) — precede the key that covers the rest of the list. An entry on any other host, a target's public URL
  # left on a hub among them, is the rest.
  - key: "configmap:agent-platform-mcps.mcpServers[http://mcp-kubernetes.mcp-kubernetes.svc:8080/mcp]"
    kind: template
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers (mcp-kubernetes, mcp-prometheus, mcp-capi); this mcp-kubernetes
      entry repeats the in-cluster one, and a patch entry replaces the whole list.
  - key: "configmap:agent-platform-mcps.mcpServers[<scheme>://mcp-kubernetes.<domain>/mcp]"
    kind: template
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers (mcp-kubernetes, mcp-prometheus, mcp-capi); this mcp-kubernetes
      entry at mcp-kubernetes.<domain> is the installation's own, and a patch entry replaces the whole list.
  - key: "configmap:agent-platform-mcps.mcpServers[http://mcp-prometheus.mcp-prometheus.svc:8080/mcp]"
    kind: template
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers (mcp-kubernetes, mcp-prometheus, mcp-capi); this mcp-prometheus
      entry repeats the in-cluster one, and a patch entry replaces the whole list.
  - key: "configmap:agent-platform-mcps.mcpServers[<scheme>://mcp-prometheus.<domain>/mcp]"
    kind: template
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers (mcp-kubernetes, mcp-prometheus, mcp-capi); this mcp-prometheus
      entry at mcp-prometheus.<domain> is the installation's own, and a patch entry replaces the whole list.
  - key: "configmap:agent-platform-mcps.mcpServers[http://mcp-capi.mcp-capi.svc:8080/mcp]"
    kind: template
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers (mcp-kubernetes, mcp-prometheus, mcp-capi); this mcp-capi
      entry repeats the in-cluster one, and a patch entry replaces the whole list.
  - key: "configmap:agent-platform-mcps.mcpServers[<scheme>://mcp-capi.<domain>/mcp]"
    kind: template
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers (mcp-kubernetes, mcp-prometheus, mcp-capi); this mcp-capi
      entry at mcp-capi.<domain> is the installation's own, and a patch entry replaces the whole list.
  - key: configmap:agent-platform-mcps.mcpServers
    kind: migration
    reason: >-
      Removed: the shared defaults already register the installation's own three MCP servers, and a patch entry replaces the whole list. Servers beyond
      those three become MCPServer objects under extras · M19
  - key: configmap:klausGateway.slack.channelAllowlist
    kind: migration
    reason: >-
      Removed: the Klaus gateway's Slack channel allowlist is written here; the gateway listens on every channel (channelMode: all) on every installation,
      and no per-installation allowlist exists · M28
  - key: configmap:klausGateway.a2a.saToken
    kind: migration
    reason: >-
      Removed: the Klaus gateway's agent-to-agent calls are set up here with a service-account token; agent-to-agent is enabled with a default agent the
      same way on every installation, without a token value · M29
  - key: backstage:app-config:aiChat
    kind: other-definition
    reason: "Moved: the portal's aiChat block sits in the main app-config today; the Agent Platform Component carries it, and the main app-config is the customer-portal capability's to clean up · M18"
  - key: backstage:app-config:mcpActions
    kind: other-definition
    reason: >-
      Moved: the portal's mcpActions block (the chat's tool naming) sits in the main app-config today; the Agent Platform Component carries it, and the main
      app-config is the customer-portal capability's to clean up · M18
  - key: backstage:app-config:agentPlatform.skills
    kind: other-definition
    reason: >-
      Kept: agentPlatform.skills lists the portal's skill repositories in the main app-config; the customer-portal capability owns that list, and the Agent
      Platform Component writes none of it.


  # --- agent-platform configmap-values.yaml.patch ---
  - key: configmap:gitops.forbidInlineSecrets
    kind: template
    reason: "Removed: gitops.forbidInlineSecrets is set here; the shared defaults set it to the same value for every installation."
  - key: configmap:muster.muster.oauth.server.dex.clientId
    kind: template
    reason: "Removed: muster's Dex client id is written here; the shared defaults derive it from the installation's services.muster.clientId, which is where an installation-specific id belongs."
  - key: configmap:muster.muster.oauth.server.dex.allowPrivateIPOIDC
    kind: template
    reason: >-
      Removed: muster's allowPrivateIPOIDC flag is written here; the shared defaults derive it from the installation's managementCluster.private, which is
      where a private installation is declared.
  - key: configmap:components.agent-platform-mcps.enabled
    kind: template
    reason: "Removed: components.agent-platform-mcps.enabled is set here; the shared defaults enable the component on every installation."
  - key: configmap:agent-platform-mcps.agentgateway.oauthMode
    kind: template
    reason: "Removed: the agentgateway's oauthMode is written here with the one value it can have; the shared defaults set it, since the edge cannot validate muster's opaque tokens any other way."
  - key: configmap:agent-platform-mcps.identityProviders
    kind: template
    reason: "Removed: agent-platform-mcps.identityProviders is an empty map here; the shared defaults already carry the empty map, and on a hub the federation targets fill in the real entries."
  - key: configmap:agent-manager.oauth
    kind: template
    reason: >-
      Removed: this is the chart 3.x form of agent-manager's OAuth settings. Chart 4.x derives issuer, client, Secret and base URL from global.identity and
      global.domain, which this installation already sets.
  - key: configmap:cluster-manager.oauth
    kind: template
    reason: >-
      Removed: this is the chart 3.x form of cluster-manager's OAuth settings. Chart 4.x derives issuer, client, Secret and base URL from global.identity
      and global.domain, which this installation already sets.

  # --- dex-app secret-values.yaml.patch ---
  - key: dex-secret:oidc.staticClients.muster.clientID
    kind: template
    reason: "Removed: muster's Dex client id is repeated in the encrypted Dex values; the shared defaults derive it from the installation's services.muster.clientId."
  - key: dex-secret:oidc.staticClients.muster.clientSecret
    kind: referenced-secret
    reason: "Removed: muster's Dex client secret is inline in the encrypted Dex values; the client reads it from the Secret dex-client-muster-secret in the cluster instead. Needs dex-app 3.2.2 · M1"
  - key: dex-secret:oidc.staticClients.dexK8SAuthenticator.clientSecret
    kind: referenced-secret
    reason: "Removed: the dex-k8s-authenticator client's secret is inline in the encrypted Dex values; the client reads it from a referenced Secret in the cluster instead. Needs dex-app 3.2.2 · M1"
  - key: dex-secret:oidc.staticClients.mcpKubernetes.clientSecret
    kind: referenced-secret
    reason: >-
      Removed: mcp-kubernetes's Dex client secret is inline in the encrypted Dex values; the client reads it from the Secret
      dex-client-mcp-kubernetes-secret under extras/mcp-kubernetes instead. Needs dex-app 3.2.2 · M1
  - key: dex-secret:oidc.staticClients.mcpPrometheus.clientSecret
    kind: referenced-secret
    reason: >-
      Removed: mcp-prometheus's Dex client secret is inline in the encrypted Dex values; the client reads it from the Secret
      dex-client-mcp-prometheus-secret under extras/mcp-prometheus instead. Needs dex-app 3.2.2 · M1
  - key: dex-secret:oidc.staticClients.mcpCapi.clientSecret
    kind: referenced-secret
    reason: >-
      Removed: mcp-capi's Dex client secret is inline in the encrypted Dex values; the client reads it from the Secret dex-client-mcp-capi-secret under
      extras/mcp-capi instead. Needs dex-app 3.2.2 · M1
  - key: dex-secret:oidc.muster.clientSecret
    kind: referenced-secret
    reason: >-
      Removed: oidc.muster.clientSecret is a stray copy of muster's client secret that Dex never reads (the chart reads oidc.staticClients.muster); the
      client reads its secret from the Secret dex-client-muster-secret instead. Needs dex-app 3.2.2 · M1
  - key: dex-secret:oidc.customer
    kind: not-platform
    reason: "Kept: oidc.customer holds this installation's own login connectors and their credentials; the platform reads nothing of them and leaves them in the encrypted Dex values as they are."

  # --- dex-app configmap-values.yaml.patch ---
  - key: dex-configmap:oidc.customer
