# Fleet policy of the agent-platform definition: the decisions the platform team takes once for
# every installation, keyed by the owning organisation as the configs repository names it. The
# renderer reads the installation's customer from the record and applies these; nobody types them.
# One entry is keyed by installation: the chat gateway's installations, each a fact of the
# installation (its Slack app) and its own default agent, rather than a tuning. The model provider
# key is no decision here: every installation's is its own, created by its people after the commit
# (README.md).

# The components an organisation's installations run beside muster and its three MCP servers
# (kubernetes, prometheus, capi), which every installation runs. `default` is what an organisation
# not listed under `customers` gets. An organisation listed with an empty list runs muster and the
# servers only. The chat gateway is not a component of these lists: it runs where a Slack app
# exists (klausGateway.installations).
components:
  default: [kagent, agent-manager]
  customers:
    # Giant Swarm's own installations run the cluster-manager too, the hub included. The
    # cluster-manager is the meta chart's 4 line's: an installation on the 3 line is refused
    # until its record selects 4 (agentPlatform.kagentApiV2 in config.yaml.patch).
    giantswarm: [kagent, agent-manager, cluster-manager]
    # Tool access only: muster and the MCP servers, no agents.
    boschpt: []
    dvag: []
    vorwerk: []

# The chat gateway: where it runs and its shape. A Slack app exists per installation named under
# `installations` — the hub and the two test installations today — and the gateway runs there and
# nowhere else, its app's credentials supplied at commit (klausGateway.slack.bot-token,
# signing-secret and, on a private installation, app-token); an installation not named runs no
# gateway and asks for nothing. Each entry carries what is the installation's own: the agent
# agent-to-agent calls by default (defaultAgent), one of the installation's own agents
# (extras/agent-platform/agents/, which the definition keeps and does not render); an entry naming
# none gets a2a.defaultAgent. The shape is one for all: Slack over every channel — in events mode
# over the public route where the installation is public, in socket mode where it is private, since
# Slack cannot reach a private ingress; the mode follows the record, not this file — the
# on-behalf-of connectors, agent-to-agent, and team reviews the platform's own workloads may call:
# the repository manager, the marge sweep, the platform manager posting its approvals — in the
# hub's order, since the list is compared by index.
klausGateway:
  installations:
    gazelle: {defaultAgent: swarmgeist}
    graveler: {defaultAgent: sre-agent}
    glean: {defaultAgent: sre-agent}
  slack:
    channelMode: all
  obo:
    connectors: true
  a2a:
    enabled: true
    defaultAgent: swarmgeist
  reviews:
    enabled: true
    audience: klaus-gateway
    allowedCallers:
      - system:serviceaccount:agent-platform:giantswarm-repo-manager
      - system:serviceaccount:marge:marge-bumblebee-sweep
      - system:serviceaccount:agent-platform:giantswarm-platform-manager

# Where the platform's release candidates run: every component and the platform chart itself
# follow the candidate each push cuts (vX.Y.Z-rc.N: the chart's gitops.prereleases and the range
# >=4.0.0-0 <5.0.0-0 with the release tag filter), before a person promotes it to the stable release
# every other installation follows. An installation runs them where its app collection follows
# `stage` (installation.collectionsStage: management-cluster-bases' testing stages select the
# collections' candidates the same way) and its organisation is listed under `customers`. The 4
# chart line's: such an installation on the 3 line is refused. Taking an installation off this list
# (or its collection off `stage`) drops the candidates, and its stable-only range selects the latest
# stable release: while agent-platform's newest candidate is ahead of it, that is a downgrade, so the
# commit is held (commitRefused) until the candidate is promoted (devctl release promote).
releaseCandidates:
  stage: testing
  customers: [giantswarm]

# Federation: the connector a target's Dex registers for a hub, as Go templates over the hub's
# record ({{ .Customer }}, {{ .Name }}), and the Teleport cluster a tunnel joins. A target's Dex
# registers one connector per hub that brokers into it, and only one of an organisation's hubs can
# carry the organisation's plain name: the target's first hub of the organisation registers `first`
# — the registry's hub where it is one, else the first by name; the target's only hub, mostly —,
# every further hub of the same organisation `further`, named after the hub. Which hubs broker into
# a target is the record's (installation.federation.targets[*].hubs on the hub,
# installation.federation.connectors on the target, both from the portals on record). The hub names
# the connector in its broker and identity providers; the target's own definition — agent-platform
# where the platform runs there, cluster-mcp-servers otherwise — registers it on the target's Dex,
# an oidc connector trusting the hub's Dex as the issuer, under oidc.customer.connectors next to the
# target's own login connectors. The organisations under `fromBase` are the exception: the fleet's
# Dex base registers their hubs' connectors on every installation (giantswarm-simple-oidc), so a
# target renders none for them.
federation:
  connector:
    first: "{{ .Customer }}-simple-oidc"
    further: "{{ .Customer }}-{{ .Name }}-oidc"
    fromBase: [giantswarm]
  teleport:
    clusterName: teleport.giantswarm.io
    proxyAddr: teleport.giantswarm.io:443
  # The installations a hub's portal lists for browsing alone, by name: the broker still mints the
  # person's tokens for their API servers, through the dex and kubernetes tunnels where they are
  # private, and no hub federates their MCP servers, registers an identity provider at their Dex or
  # tunnels to their MCP servers, kagent or agentgateway. A hub's own tokens of the tunnels it no
  # longer renders leave teleport-fleet's values, and a tunnel with them once no token is left.
  browseOnly: [elver]

# The poll interval of every OCIRepository the definition renders (the tunnelport operator's today):
# the one every Bumblebee OCIRepository of an installation's extras polls at, so a release runs
# within minutes of its push without a manual reconcile. Their HelmReleases keep their own interval.
flux:
  sourceInterval: 1m
