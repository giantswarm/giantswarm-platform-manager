# Fleet policy of the agent-platform definition: the decisions the platform team takes once for
# every installation, keyed by the owning organisation as the configs repository names it. The
# renderer reads the installation's customer from the record and applies these; nobody types them.
# One entry is keyed by installation: the chat gateway's installations, each a fact of the
# installation (its Slack app) and its own default agent, rather than a tuning. The model provider
# key is no decision here: every installation's is its own, created by its people after the commit
# (README.md).

# The components an organisation's installations run beside muster and its three MCP servers
# (kubernetes, prometheus, capi), which every installation runs. `default` is what an organisation
# not listed under `customers` gets. An organisation listed with an empty list runs muster and the
# servers only. The chat gateway is not a component of these lists: it runs where a Slack app
# exists (klausGateway.installations).
components:
  default: [kagent, agent-manager]
  customers:
    # Giant Swarm's own installations run the cluster-manager too, the hub included. The
    # cluster-manager is the meta chart's 4 line's: an installation on the 3 line is refused
    # until its record selects 4 (agentPlatform.kagentApiV2 in config.yaml.patch).
    giantswarm: [kagent, agent-manager, cluster-manager]
    # Agents without the agent-manager's create/edit surface.
    fleetio: [kagent]
    # Tool access only: muster and the MCP servers, no agents.
    boschpt: []
    dvag: []
    vorwerk: []

# The chat gateway: where it runs and its shape. A Slack app exists per installation named under
# `installations` — the hub and the two test installations today — and the gateway runs there and
# nowhere else, its app's credentials supplied at commit (klausGateway.slack.bot-token,
# signing-secret and, on a private installation, app-token); an installation not named runs no
# gateway and asks for nothing. Each entry carries what is the installation's own: the agent
# agent-to-agent calls by default (defaultAgent), one of the installation's own agents
# (extras/agent-platform/agents/, which the definition keeps and does not render); an entry naming
# none gets a2a.defaultAgent. The shape is one for all: Slack over every channel — in events mode
# over the public route where the installation is public, in socket mode where it is private, since
# Slack cannot reach a private ingress; the mode follows the record, not this file — the
# on-behalf-of connectors, agent-to-agent, and team reviews the platform's own workloads may call:
# the platform manager posting its approvals, the repository manager, the marge sweep.
klausGateway:
  installations:
    gazelle: {defaultAgent: swarmgeist}
    graveler: {defaultAgent: sre-agent}
    glean: {defaultAgent: sre-agent}
  slack:
    channelMode: all
  obo:
    connectors: true
  a2a:
    enabled: true
    defaultAgent: swarmgeist
  reviews:
    enabled: true
    audience: klaus-gateway
    allowedCallers:
      - system:serviceaccount:agent-platform:giantswarm-platform-manager
      - system:serviceaccount:agent-platform:giantswarm-repo-manager
      - system:serviceaccount:marge:marge-bumblebee-sweep

# The hub side of federation: the connector every target's Dex registers for its hub, as a Go
# template over the hub's record ({{ .Customer }}), and the Teleport cluster a tunnel joins.
federation:
  connector: "{{ .Customer }}-simple-oidc"
  teleport:
    clusterName: teleport.giantswarm.io
    proxyAddr: teleport.giantswarm.io:443
