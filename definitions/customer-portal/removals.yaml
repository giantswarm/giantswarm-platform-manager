# Keys found in a portal installation's extras/backstage fileset that no input of schema.json renders.
# Each is dropped from the fileset by the renderer, for the reason given. Key paths use the file prefixes and
# the normalisation of schema.json's x-renders ([*] for a list index, [x] for the list entry with identity x,
# <name> for a per-installation map key; a reason may reference <name> and is filled with the key that matched).
# backstage:kustomization:<path> names a path in a kustomization, inside the text of a patch included: the
# HelmRelease patch's values sources are spec.valuesFrom[<name>], one leaf per field of the source.
#
# The reason is what the Dev Portal shows a platform engineer next to the planned change, so it is one
# sentence in their words: what is on the installation today, what replaces it and why. It starts with
# Removed:, Moved: or Changed:, names the value or the object, and never the file the key is in (the file
# is the group the change is listed under). A removal that belongs to a migration of the fleet's list
# (shared with agent-platform/migrations.yaml) carries the migration as a trailing tag (· M<n>).
#
# kinds:
#   other-definition    the portal's agent-platform section, which the agent-platform definition renders as its
#                       own Component next to the portal's files; each key is one that definition renders. The
#                       section leaves the main app-config once the Component's fragment on record owns the
#                       portal's lists (platformSection.componentLists); until then the render keeps it as the
#                       record carries it (platformSection.appConfig) and includes the extension list with the
#                       platform's section, so the removal is planned only once the fragment carries the key
#   hub                 a section of the hub's Dev Portal (pages the hub serves over muster, the hub's incident,
#                       CircleCI proxy and scaffolder configuration, its Postgres database); out of the definition
#                       until a hub shape exists. The comparison plans the removal; a commit whose plan removes one
#                       the record carries with a value (not null, not empty) is refused for the installation,
#                       naming the sections, so a customer-portal commit never strips the hub's portal
#   not-rendered        an entry of the hub's registry of installations (gs.installations) that a customer portal
#                       does not list: the definition renders the portal's own installation and the ones it
#                       federates, and an entry beyond them goes with an ordinary removal
#   off-value           a flag at the value it has when the key is absent; dropping it changes nothing
#   deprecated-form     a key in a form its plugin has deprecated; the definition renders the same value in the form
#                       the plugin documents
removals:
  # --- Backstage app-config.yaml: flags at their off value ---
  - key: "backstage:app-config:auth.experimentalClientIdMetadataDocuments"
    kind: off-value
    reason: "Removed: auth.experimentalClientIdMetadataDocuments is set to false here, which is what the auth backend does without the key; dropping it changes nothing."

  # --- Backstage app-config.yaml: deprecated forms ---
  - key: "backstage:app-config:grafana.domain"
    kind: deprecated-form
    reason: "Changed: grafana.domain is the Grafana plugin's deprecated single-host form; the installation's own Grafana is listed as the one host of grafana.hosts, the form the plugin documents."

  # --- Backstage app-config.yaml: the agent-platform section, kept until the Component's fragment owns the lists ---
  - key: "backstage:app-config:muster"
    kind: other-definition
    reason: "Moved: the muster entries in the main app-config move into the Agent Platform Component's app-config fragment, which lists the installation's muster."
  - key: "backstage:app-config:agentPlatform.kagent"
    kind: other-definition
    reason: "Moved: agentPlatform.kagent (the installations whose agents the portal shows) moves from the main app-config into the Agent Platform Component's app-config fragment, which lists the installation where kagent runs."
  - key: "backstage:app-config:agentPlatform.skills"
    kind: other-definition
    reason: "Moved: agentPlatform.skills (the repositories the portal's agent creation discovers skills in) moves from the main app-config into the Agent Platform Component's app-config fragment, which carries the same repositories (its skills.repositories input)."
  - key: "backstage:app-config:agentPlatform.fluxServiceAccountName"
    kind: other-definition
    reason: "Moved: agentPlatform.fluxServiceAccountName (the agents' Flux identity) leaves the main app-config; the Agent Platform Component's app-config fragment names it for a portal whose chart reads it, one before backstage 1.1.0."
  - key: "backstage:app-config:aiChat"
    kind: other-definition
    reason: "Moved: the aiChat block (the chat on Anthropic's API, its model and its MCP servers) moves from the main app-config into the Agent Platform Component's app-config fragment, which carries it where the chat is on · M18"
  - key: "backstage:app-config:mcpActions"
    kind: other-definition
    reason: "Moved: the mcpActions block (the chat's tool naming) moves from the main app-config into the Agent Platform Component's app-config fragment, which carries it where the chat is on · M18"
  - key: "backstage:app-config:backend.actions"
    kind: other-definition
    reason: "Moved: backend.actions (the actions the portal lists for the chat's MCP actions server: the plugin sources and the filter) moves from the main app-config into the Agent Platform Component's app-config fragment, which carries it where the chat is on · M18"
  - key: "backstage:app-config:app.extensions.$include"
    kind: other-definition
    reason: >-
      Changed: app.extensions includes one list by $include in the main app-config today; where the platform runs, the main app-config
      includes the shared list with the platform's section (shared-config.yaml#extensionsAgentPlatform, with the chat's entries and the
      Grafana dashboards card where they are on) while the Agent Platform Component's fragment carries no list, and the list without it
      (#extensions, or #extensionsGrafanaDashboards with the Grafana plugin wired) once the fragment's list, which Backstage keeps over it, does.
  - key: "backstage:app-config:app.extensions[*]"
    kind: other-definition
    reason: >-
      Changed: the extensions are listed one by one in the main app-config today; the main app-config includes the shared list by $include
      instead — where the platform runs and the Agent Platform Component's fragment carries no list yet, the one with the platform's section
      (shared-config.yaml#extensionsAgentPlatform, with the chat's entries and the Grafana dashboards card where they are on), else the one
      without it (#extensions, or #extensionsGrafanaDashboards) — so the entries listed by hand go.

  # --- Backstage app-config.yaml: the hub's Dev Portal ---
  - key: "backstage:app-config:pagerDuty"
    kind: hub
    reason: "Removed: the pagerDuty block links the hub's incidents; a customer portal has no incident page, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:proxy.endpoints./circleci/api"
    kind: hub
    reason: "Removed: the /circleci/api proxy is the hub's CircleCI API proxy; a customer portal proxies only its installation's Grafana, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:repositories"
    kind: hub
    reason: "Removed: the repositories block is the hub's repositories page over muster; a customer portal has no such page, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:plans"
    kind: hub
    reason: "Removed: the plans block is the hub's plans page over muster; a customer portal has no such page, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:roadmap"
    kind: hub
    reason: "Removed: the roadmap block is the hub's roadmap page over muster; a customer portal has no such page, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:scaffolder"
    kind: hub
    reason: "Removed: the scaffolder block is the hub's software templates; a customer portal has no scaffolder, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:gs.github"
    kind: hub
    reason: "Removed: gs.github is the hub's GitHub pages over muster; a customer portal has no such pages, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:gs.containerRegistry"
    kind: hub
    reason: "Removed: gs.containerRegistry is the hub's registry access; a customer portal has no registry page, and the hub's own shape is not rendered yet."
  - key: "backstage:app-config:gs.installations.<name>"
    kind: not-rendered
    reason: "Removed: gs.installations lists every installation the hub knows; a customer portal lists only its own installation and those under federation.installations, so the entry for <name> goes."
  - key: "backstage:app-config:backend.database"
    kind: hub
    reason: "Removed: backend.database connects the hub to Postgres with its per-plugin division; a customer portal runs on the in-memory database, so the block goes."

  # --- Backstage user-values.yaml ---
  - key: "backstage:user-values:database"
    kind: hub
    reason: "Removed: the database block sizes the hub's Postgres engine and volume; a customer portal runs on the in-memory database, so the block goes."
  - key: "backstage:user-values:google"
    kind: other-definition
    reason: "Moved: the Google project and location of a Vertex chat leave the portal's user values for the Agent Platform Component's values · M18"
  - key: "backstage:user-values:backstage.extraAppConfig"
    kind: other-definition
    reason: "Moved: the mount of the platform's app-config fragment (extraAppConfig) leaves the portal's user values for the Agent Platform Component's values."

  # --- Backstage kustomization.yaml and files ---
  - key: "backstage:kustomization:spec.valuesFrom[google-credentials-backstage]"
    kind: other-definition
    reason: "Moved: the HelmRelease's values source google-credentials-backstage (a Vertex chat's Google credentials) leaves the portal's kustomization patch for the Agent Platform Component, which carries the credentials in its own Secret · M18"
  - key: "backstage:kustomization:resources[google-credentials.enc.yaml]"
    kind: other-definition
    reason: "Moved: the google-credentials.enc.yaml resource entry leaves the portal's kustomization for the Agent Platform Component, which carries a Vertex chat's Google credentials in its own Secret · M18"
  - key: "backstage:file:google-credentials.enc.yaml"
    kind: other-definition
    reason: "Moved: google-credentials.enc.yaml (a Vertex chat's Google credentials) leaves the portal's directory for the Agent Platform Component's Secret agent-platform-ai-chat-credentials-backstage · M18"
